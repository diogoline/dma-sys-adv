          <div class="col-md-5"><label class="form-label">Nome *</label><input class="form-control" data-campo="nome" value="${UI.esc(v.nome)}"></div>
          <div class="col-md-7"><label class="form-label">Descrição</label><input class="form-control" data-campo="descricao" value="${UI.esc(v.descricao)}"></div>
          ${master ? '' : `<div class="col-12"><label class="form-label">Quais registros este cargo enxerga?</label>
            <select class="form-select" data-campo="escopo_dados">${Object.entries(this.ESCOPOS).map(([k, t]) => `<option value="${k}" ${v.escopo_dados === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
            <div class="form-text">Vale para clientes, casos, agenda e contratos (a partir da fase 2).</div></div>`}
        </div>
        <h3 class="h6">Permissões por módulo</h3>${matriz}`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });

    const sincTudo = tr => { const t = tr.querySelector('[data-tudo]'); if (t) t.checked = [...tr.querySelectorAll('[data-acao-perm]')].every(i => i.checked); };
    m.el.querySelectorAll('tr[data-modulo]').forEach(sincTudo);
    m.el.querySelectorAll('[data-acao-perm]').forEach(i => i.addEventListener('change', () => sincTudo(i.closest('tr'))));
    m.el.querySelectorAll('[data-tudo]').forEach(t => t.addEventListener('change', () => {
      t.closest('tr').querySelectorAll('[data-acao-perm]').forEach(i => i.checked = t.checked);
    }));
    m.el.querySelectorAll('[data-acao-perm]').forEach(i => i.addEventListener('change', () => {
      const tr = i.closest('tr');
      if (i.checked && i.dataset.acaoPerm !== 'ver') tr.querySelector('[data-acao-perm="ver"]').checked = true;
      if (!i.checked && i.dataset.acaoPerm === 'ver') tr.querySelectorAll('[data-acao-perm]').forEach(x => x.checked = false);
    }));

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const dados = UI.lerForm(m.el);
      if (c) dados.id_cargo = c.id_cargo;
      if (!dados.nome) return UI.toast('Informe o nome do cargo.', 'aviso');
      dados.permissoes = {};
      m.el.querySelectorAll('tr[data-modulo]').forEach(tr => {
        const p = {};
        tr.querySelectorAll('[data-acao-perm]').forEach(i => p[i.dataset.acaoPerm] = i.checked);
        dados.permissoes[tr.dataset.modulo] = p;
      });
      await UI.ocupado(ev.target, async () => {
        try {
          await Api.chamar('cargos.salvar', dados);
          m.fechar();
          UI.toast('Cargo salvo.');
          await App.recarregarDados();
          await this.carregar();
        } catch (e) { UI.erro(e); }
      });
    };
  },

  async alternarAtivo(c) {
    const ativar = c.ativo === 'NAO';
    if (!await UI.confirmar(`${ativar ? 'Reativar' : 'Inativar'} o cargo ${c.nome}?`, { botao: ativar ? 'Reativar' : 'Inativar', perigo: !ativar })) return;
    try {
      await Api.chamar('cargos.alternarAtivo', { id_cargo: c.id_cargo });
      UI.toast('Cargo atualizado.');
      await App.recarregarDados();
      await this.carregar();
    } catch (e) { UI.erro(e); }
  }
};

</script>
<script>
/* ======== js/modulos/configuracoes.js ======== */
/**
 * Configurações — escritório, unidades, áreas de atuação, listas e parâmetros de segurança.
 */
Modulos.configuracoes = {
  D: null,
  aba: 'escritorio',

  async render(el) {
    el.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Configurações</h1><p>Cadastros básicos e parâmetros do sistema</p></div></div>
      <ul class="nav nav-pills mb-3 gap-1" id="cfg-abas">
        <li class="nav-item"><button class="nav-link" data-aba="escritorio"><i class="bi bi-building me-1"></i>Escritório</button></li>
        <li class="nav-item"><button class="nav-link" data-aba="unidades"><i class="bi bi-geo-alt me-1"></i>Unidades</button></li>
        <li class="nav-item"><button class="nav-link" data-aba="areas"><i class="bi bi-tags me-1"></i>Áreas de atuação</button></li>
        <li class="nav-item"><button class="nav-link" data-aba="listas"><i class="bi bi-list-ul me-1"></i>Listas</button></li>
        <li class="nav-item"><button class="nav-link" data-aba="modelos"><i class="bi bi-file-earmark-richtext me-1"></i>Modelos de documento</button></li>
        <li class="nav-item"><button class="nav-link" data-aba="sistema"><i class="bi bi-shield-check me-1"></i>Segurança</button></li>
      </ul>
      <div id="cfg-conteudo" class="cartao"><div class="vazio"><div class="spinner-border"></div></div></div>`;

    el.querySelector('#cfg-abas').addEventListener('click', e => {
      const b = e.target.closest('[data-aba]');
      if (b) { this.aba = b.dataset.aba; this.desenhar(); }
    });
    await this.carregar();
  },

  async carregar() {
    try { this.D = await Api.chamar('config.dados'); } catch (e) { return UI.erro(e); }
    this.desenhar();
  },

  podeEditar() { return App.pode('configuracoes', 'editar'); },

  desenhar() {
    document.querySelectorAll('#cfg-abas [data-aba]').forEach(b => b.classList.toggle('active', b.dataset.aba === this.aba));
    const el = document.getElementById('cfg-conteudo');
    if (!el || !this.D) return;
    ({ escritorio: () => this.abaEscritorio(el), unidades: () => this.abaUnidades(el), areas: () => this.abaAreas(el),
       listas: () => this.abaListas(el), sistema: () => this.abaSistema(el), modelos: () => this.abaModelos(el) })[this.aba]();
  },

  async salvarConfig(el, botao) {
    const dados = UI.lerForm(el);
    await UI.ocupado(botao, async () => {
      try {
        this.D.config = await Api.chamar('config.salvar', dados);
        UI.toast('Configurações salvas.');
        await App.carregar(); // atualiza nome/logo do escritório na tela
      } catch (e) { UI.erro(e); }
    });
  },

  campo(rotulo, chave, col = 'col-md-6', ajuda = '') {
    return `<div class="${col}"><label class="form-label">${rotulo}</label>
      <input class="form-control" data-campo="${chave}" value="${UI.esc(this.D.config[chave])}" ${this.podeEditar() ? '' : 'disabled'}>
      ${ajuda ? `<div class="form-text">${ajuda}</div>` : ''}</div>`;
  },

  abaEscritorio(el) {
    el.innerHTML = `<div class="row g-3">
      ${this.campo('Nome do escritório', 'escritorio_nome')}
      ${this.campo('CNPJ', 'escritorio_cnpj', 'col-md-3')}
      ${this.campo('Telefone', 'escritorio_telefone', 'col-md-3')}
      ${this.campo('Endereço principal', 'escritorio_endereco', 'col-md-8')}
      ${this.campo('E-mail', 'escritorio_email', 'col-md-4')}
      ${this.campo('URL da logo', 'escritorio_logo_url', 'col-md-8', 'Imagem pública (PNG/JPG). Aparece no menu e nos documentos.')}
      ${this.campo('Foro de eleição padrão', 'foro_padrao', 'col-md-4', 'Usado na cláusula de foro dos contratos.')}
      ${this.podeEditar() ? '<div class="col-12 text-end"><button class="btn btn-primary" data-salvar>Salvar</button></div>' : ''}
    </div>`;
    const b = el.querySelector('[data-salvar]');
    if (b) b.onclick = () => this.salvarConfig(el, b);
  },

  abaSistema(el) {
    el.innerHTML = `<div class="row g-3">
      ${this.campo('Horas até a sessão expirar', 'sessao_horas', 'col-md-4', 'Por inatividade. Máximo de 6 horas.')}
      ${this.campo('Tentativas de login antes do bloqueio', 'max_tentativas_login', 'col-md-4')}
      ${this.campo('Minutos de bloqueio', 'bloqueio_minutos', 'col-md-4')}
      ${this.campo('Dias de antecedência para alerta de prazo', 'dias_alerta_prazo', 'col-md-4')}
      <div class="col-md-4"><label class="form-label">Tema padrão para novos usuários</label>
        <select class="form-select" data-campo="tema_padrao" ${this.podeEditar() ? '' : 'disabled'}>
          ${UI.opcoes([{ id: 'classico', nome: 'Clássico' }, { id: 'noturno', nome: 'Noturno' }, { id: 'bordo', nome: 'Bordô' }], this.D.config.tema_padrao, { vazio: null })}
        </select></div>
      ${this.podeEditar() ? '<div class="col-12 text-end"><button class="btn btn-primary" data-salvar>Salvar</button></div>' : ''}
    </div>`;
    const b = el.querySelector('[data-salvar]');
    if (b) b.onclick = () => this.salvarConfig(el, b);
  },

  /** Tabela genérica para Unidades / Áreas / Listas */
  cadastroSimples(el, { tabela, idCampo, dados, colunas, busca, form, rotaSalvar, titulo, filtros, extraBarra }) {
    el.innerHTML = `<div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">${UI.esc(titulo)}</h2>
        ${App.pode('configuracoes', 'criar') ? '<button class="btn btn-primary btn-sm" data-novo><i class="bi bi-plus-lg me-1"></i>Adicionar</button>' : ''}
      </div><div data-tab></div>`;
    const acoes = {
      titulo: '', classe: 'text-end', render: r => `<div class="btn-group btn-group-sm">
        ${this.podeEditar() ? `<button class="btn btn-outline-secondary" data-ed="${UI.esc(r[idCampo])}" title="Editar"><i class="bi bi-pencil"></i></button>` : ''}
        ${App.pode('configuracoes', 'excluir') ? `<button class="btn btn-outline-secondary" data-at="${UI.esc(r[idCampo])}" title="${r.ativo === 'NAO' ? 'Reativar' : 'Inativar'}"><i class="bi ${r.ativo === 'NAO' ? 'bi-arrow-counterclockwise' : 'bi-slash-circle'}"></i></button>` : ''}
      </div>`
    };
    UI.tabela(el.querySelector('[data-tab]'), {
      dados, busca, filtros, extraBarra, porPagina: 20,
      linhaClasse: r => r.ativo === 'NAO' ? 'linha-inativa' : '',
      colunas: colunas.concat([{ titulo: 'Situação', render: r => r.ativo === 'NAO' ? '<span class="chip chip-off">Inativo</span>' : '<span class="chip chip-ok">Ativo</span>' }, acoes])
    });

    const abrir = reg => {
      const m = UI.modal({
        titulo: reg ? 'Editar' : 'Adicionar', corpo: `<div class="row g-3">${form(reg || {})}</div>`,
        rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
      });
      m.el.querySelector('[data-salvar]').onclick = async ev => {
        const d = UI.lerForm(m.el);
        if (reg) d[idCampo] = reg[idCampo];
        await UI.ocupado(ev.target, async () => {
          try {
            await Api.chamar(rotaSalvar, d);
            m.fechar(); UI.toast('Salvo.');
            await App.recarregarDados();
            await this.carregar();
          } catch (e) { UI.erro(e); }
        });
      };
    };

    const novo = el.querySelector('[data-novo]');
    if (novo) novo.onclick = () => abrir(null);
    el.querySelector('[data-tab]').addEventListener('click', async e => {
      const ed = e.target.closest('[data-ed]');
      const at = e.target.closest('[data-at]');
      if (ed) abrir(dados.find(x => x[idCampo] === ed.dataset.ed));
      if (at) {
        const reg = dados.find(x => x[idCampo] === at.dataset.at);
        if (!await UI.confirmar(reg.ativo === 'NAO' ? 'Reativar este item?' : 'Inativar este item? Ele deixa de aparecer nas opções, mas registros antigos continuam com ele.', { perigo: reg.ativo !== 'NAO' })) return;
        try {
          await Api.chamar('config.alternarAtivo', { tabela, id: reg[idCampo] });
          await App.recarregarDados();
          await this.carregar();
        } catch (er) { UI.erro(er); }
      }
    });
  },

  abaUnidades(el) {
    this.cadastroSimples(el, {
      tabela: 'Unidades', idCampo: 'id_unidade', dados: this.D.unidades, titulo: 'Unidades do escritório',
      rotaSalvar: 'config.salvarUnidade', busca: ['nome', 'cidade', 'endereco'],
      colunas: [{ titulo: 'Nome', campo: 'nome' }, { titulo: 'Cidade/UF', render: r => UI.esc([r.cidade, r.uf].filter(Boolean).join(' - ')) },
        { titulo: 'Endereço', campo: 'endereco' }, { titulo: 'Foro', campo: 'foro_padrao' }],
      form: r => `
        <div class="col-md-8"><label class="form-label">Nome *</label><input class="form-control" data-campo="nome" value="${UI.esc(r.nome)}"></div>
        <div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" data-campo="telefone" value="${UI.esc(r.telefone)}"></div>
        <div class="col-12"><label class="form-label">Endereço</label><input class="form-control" data-campo="endereco" value="${UI.esc(r.endereco)}"></div>
        <div class="col-md-6"><label class="form-label">Cidade</label><input class="form-control" data-campo="cidade" value="${UI.esc(r.cidade)}"></div>
        <div class="col-md-2"><label class="form-label">UF</label><input class="form-control" maxlength="2" data-campo="uf" value="${UI.esc(r.uf)}"></div>
        <div class="col-md-4"><label class="form-label">Foro padrão</label><input class="form-control" data-campo="foro_padrao" value="${UI.esc(r.foro_padrao)}"></div>`
    });
  },

  abaAreas(el) {
    this.cadastroSimples(el, {
      tabela: 'Areas_Atuacao', idCampo: 'id_area', dados: this.D.areas, titulo: 'Áreas de atuação',
      rotaSalvar: 'config.salvarArea', busca: ['nome', 'descricao'],
      colunas: [{ titulo: 'Área', render: r => `<span class="ponto-cor" style="background:${UI.esc(r.cor)}"></span>${UI.esc(r.nome)}` },
        { titulo: 'Descrição', campo: 'descricao' }],
      form: r => `
        <div class="col-md-9"><label class="form-label">Nome *</label><input class="form-control" data-campo="nome" value="${UI.esc(r.nome)}"></div>
        <div class="col-md-3"><label class="form-label">Cor</label><input type="color" class="form-control form-control-color w-100" data-campo="cor" value="${UI.esc(r.cor || '#14213d')}"></div>
        <div class="col-12"><label class="form-label">Descrição</label><input class="form-control" data-campo="descricao" value="${UI.esc(r.descricao)}"></div>`
    });
  },

  abaListas(el) {
    const nomes = this.D.nomes_listas;
    const dados = this.D.listas.map(l => Object.assign({ _nome_lista: nomes[l.lista] || l.lista }, l))
      .sort((a, b) => a._nome_lista.localeCompare(b._nome_lista) || (+a.ordem - +b.ordem));
    this.cadastroSimples(el, {
      tabela: 'Listas', idCampo: 'id_lista', dados, titulo: 'Opções das listas de seleção',
      rotaSalvar: 'config.salvarItemLista', busca: ['valor', '_nome_lista'],
      filtros: [{ campo: 'lista', titulo: 'Lista', opcoes: Object.entries(nomes).map(([k, v]) => ({ valor: k, rotulo: v })) }],
      colunas: [{ titulo: 'Lista', campo: '_nome_lista' }, { titulo: 'Valor', campo: 'valor' }, { titulo: 'Ordem', campo: 'ordem' }],
      form: r => `
        <div class="col-12"><label class="form-label">Lista *</label>
          <select class="form-select" data-campo="lista" ${r.lista ? 'disabled' : ''}>${UI.opcoes(Object.entries(nomes).map(([k, v]) => ({ id: k, nome: v })), r.lista, { vazio: 'Selecione' })}</select></div>
        <div class="col-md-9"><label class="form-label">Valor *</label><input class="form-control" data-campo="valor" value="${UI.esc(r.valor)}"></div>
        <div class="col-md-3"><label class="form-label">Ordem</label><input type="number" class="form-control" data-campo="ordem" value="${UI.esc(r.ordem || '99')}"></div>`
    });
  },
  async abaModelos(el) {
    el.innerHTML = '<div class="vazio"><div class="spinner-border"></div></div>';
    let modelos;
    try { modelos = await Api.chamar('config.modelos'); } catch (e) { return UI.erro(e); }
    modelos.forEach(m => { m._cat = m.categoria === 'TEXTO_PADRAO' ? 'Texto padrão' : 'Documento'; });
    const destinos = { poderes_gerais: 'Poderes gerais', poderes_especiais: 'Poderes especiais', objeto: 'Objeto' };
    el.innerHTML = `<div class="d-flex justify-content-between align-items-center mb-2">
        <div><h2 class="h6 mb-0">Modelos de documento e textos padrão</h2>
        <div class="small texto-2">Documentos geram procuração, contrato etc. Textos padrão preenchem os poderes no formulário do contrato.</div></div>
        ${App.pode('configuracoes', 'criar') ? '<button class="btn btn-primary btn-sm" data-novo><i class="bi bi-plus-lg me-1"></i>Novo modelo</button>' : ''}
      </div><div data-tab></div>`;
    UI.tabela(el.querySelector('[data-tab]'), {
      dados: modelos, busca: ['nome', 'tipo'], porPagina: 20,
      filtros: [{ campo: '_cat', titulo: 'Categoria', opcoes: [{ valor: 'Documento', rotulo: 'Documentos' }, { valor: 'Texto padrão', rotulo: 'Textos padrão' }] }],
      linhaClasse: r => r.ativo === 'NAO' ? 'linha-inativa' : '',
      colunas: [
        { titulo: 'Nome', render: r => `<span class="fw-semibold">${UI.esc(r.nome)}</span>` },
        { titulo: 'Categoria', render: r => `<span class="chip">${r._cat}</span>${r.campo_destino ? ' <span class="small texto-2">→ ' + destinos[r.campo_destino] + '</span>' : ''}` },
        { titulo: 'Área', render: r => r.id_area ? App.areaHtml(r.id_area) : '<span class="texto-2 small">todas</span>' },
        { titulo: 'Ordem', campo: 'ordem' },
        { titulo: 'Situação', render: r => r.ativo === 'NAO' ? '<span class="chip chip-off">Inativo</span>' : '<span class="chip chip-ok">Ativo</span>' },
        { titulo: '', classe: 'text-end', render: r => `<div class="btn-group btn-group-sm">
          ${this.podeEditar() ? `<button class="btn btn-outline-secondary" data-ed="${UI.esc(r.id_modelo)}"><i class="bi bi-pencil"></i></button>` : ''}
          ${App.pode('configuracoes', 'excluir') ? `<button class="btn btn-outline-secondary" data-at="${UI.esc(r.id_modelo)}"><i class="bi ${r.ativo === 'NAO' ? 'bi-arrow-counterclockwise' : 'bi-slash-circle'}"></i></button>` : ''}</div>` }
      ]
    });
    const novo = el.querySelector('[data-novo]');
    if (novo) novo.onclick = () => this.editorModelo(null, () => this.abaModelos(el));
    el.querySelector('[data-tab]').addEventListener('click', async e => {
      const ed = e.target.closest('[data-ed]'), at = e.target.closest('[data-at]');
      if (ed) this.editorModelo(modelos.find(m => m.id_modelo === ed.dataset.ed), () => this.abaModelos(el));
      if (at) {
        try { await Api.chamar('config.alternarAtivo', { tabela: 'Modelos_Documento', id: at.dataset.at }); Modulos.contratos.padroes = null; this.abaModelos(el); } catch (er) { UI.erro(er); }
      }
    });
  },

  editorModelo(mo, aoSalvar) {
    const v = mo || { categoria: 'DOCUMENTO', ordem: '99' };
    const m = UI.modal({
      titulo: mo ? 'Editar modelo' : 'Novo modelo', tamanho: 'modal-xl',
      corpo: `<div class="row g-3">
        ${UI.campo({ rotulo: 'Nome', campo: 'nome', valor: v.nome, col: 'col-md-5', obrig: true })}
        ${UI.campo({ rotulo: 'Categoria', campo: 'categoria', valor: v.categoria, tipo: 'select', col: 'col-md-3', vazio: null, opcoes: [{ id: 'DOCUMENTO', nome: 'Documento' }, { id: 'TEXTO_PADRAO', nome: 'Texto padrão' }] })}
        ${UI.campo({ rotulo: 'Área (opcional)', campo: 'id_area', valor: v.id_area, tipo: 'select', col: 'col-md-3', opcoes: App.S.areas, vazio: 'Todas' })}
        ${UI.campo({ rotulo: 'Ordem', campo: 'ordem', valor: v.ordem, tipo: 'number', col: 'col-md-1' })}
        ${UI.campo({ rotulo: 'Usar no campo', campo: 'campo_destino', valor: v.campo_destino, tipo: 'select', col: 'col-md-4 so-texto', vazio: 'Selecione',
          opcoes: [{ id: 'poderes_gerais', nome: 'Poderes gerais' }, { id: 'poderes_especiais', nome: 'Poderes especiais' }, { id: 'objeto', nome: 'Objeto' }] })}
        ${UI.campo({ rotulo: 'Tipo de documento', campo: 'tipo', valor: v.tipo, col: 'col-md-4 so-doc', lista: App.lista('tipo_documento') })}
        <div class="col-lg-7">
          <label class="form-label">Conteúdo <span class="texto-2 small so-doc">(HTML simples: &lt;p&gt;, &lt;b&gt;, &lt;h1&gt;, &lt;h2&gt;; classes: caixa, titulo-caixa, centro, recuo)</span></label>
          <textarea class="form-control font-monospace" rows="20" style="font-size:12px" data-campo="conteudo_html">${UI.esc(v.conteudo_html)}</textarea>
        </div>
        <div class="col-lg-5">
          <label class="form-label">Campos automáticos <span class="texto-2 small">(clique para inserir)</span></label>
          <div class="d-flex flex-wrap gap-1 mb-3">${DocGen.CAMPOS.map(([c, r]) => `<button type="button" class="btn btn-sm btn-outline-secondary py-0" data-campo-ins="${c}" title="${UI.esc(r)}">{{${c}}}</button>`).join('')}</div>
          <button type="button" class="btn btn-outline-primary btn-sm" data-previa><i class="bi bi-eye me-1"></i>Pré-visualizar com dados de exemplo</button>
        </div>
      </div>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar modelo</button>`
    });
    const ta = m.el.querySelector('[data-campo="conteudo_html"]');
    const cat = m.el.querySelector('[data-campo="categoria"]');
    const ajustar = () => {
      const doc = cat.value === 'DOCUMENTO';
      m.el.querySelectorAll('.so-doc').forEach(x => x.classList.toggle('d-none', !doc));
      m.el.querySelectorAll('.so-texto').forEach(x => x.classList.toggle('d-none', doc));
    };
    cat.addEventListener('change', ajustar); ajustar();
    m.el.querySelectorAll('[data-campo-ins]').forEach(b => b.onclick = () => {
      const t = `{{${b.dataset.campoIns}}}`, i = ta.selectionStart || ta.value.length;
      ta.value = ta.value.slice(0, i) + t + ta.value.slice(ta.selectionEnd || i);
      ta.focus(); ta.selectionStart = ta.selectionEnd = i + t.length;
    });
    m.el.querySelector('[data-previa]').onclick = () => {
      const html = cat.value === 'DOCUMENTO' ? ta.value : `<p>${DocGen.texto(ta.value)}</p>`;
      DocGen.abrirPrevia(DocGen.render(html, DocGen.exemplo()), 'Prévia do modelo (dados fictícios)', 'previa');
    };
    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const d = UI.lerForm(m.el);
      if (mo) d.id_modelo = mo.id_modelo;
      if (d.categoria === 'DOCUMENTO') d.campo_destino = '';
      await UI.ocupado(ev.target, async () => {
        try { await Api.chamar('config.salvarModelo', d); m.fechar(); UI.toast('Modelo salvo.'); Modulos.contratos.padroes = null; aoSalvar(); } catch (e) { UI.erro(e); }
      });
    };
  }
};

</script>
<script>
/* ======== js/modulos/auditoria.js ======== */
/**
 * Auditoria — quem fez o quê e quando (últimos 500 registros).
 */
Modulos.auditoria = {
  ACOES: {
    CRIAR: 'Criou', EDITAR: 'Editou', INATIVAR: 'Inativou', REATIVAR: 'Reativou', LOGIN: 'Entrou',
    LOGOUT: 'Saiu', LOGIN_FALHA: 'Errou a senha', TROCAR_SENHA: 'Trocou a senha', REDEFINIR_SENHA: 'Redefiniu senha',
    REDEFINIR_SENHA_EDITOR: 'Senha redefinida pelo editor', PREFERENCIA: 'Mudou preferência'
  },

  async render(el, S) {
    el.innerHTML = `<div class="cabecalho-pagina"><div><h1>Auditoria</h1><p>Registro de ações no sistema (mais recentes primeiro)</p></div></div>
      <div class="cartao" id="aud-tabela"><div class="vazio"><div class="spinner-border"></div></div></div>`;
    let dados;
    try { dados = await Api.chamar('auditoria.listar', { limite: 500 }); } catch (e) { return UI.erro(e); }
    dados.forEach((d, i) => { d._i = i; d._acao = this.ACOES[d.acao] || d.acao; });

    const tabelas = [...new Set(dados.map(d => d.tabela).filter(Boolean))].sort();
    const usuarios = [...new Map(dados.map(d => [d.id_usuario, d.usuario_nome])).entries()];

    const cont = el.querySelector('#aud-tabela');
    UI.tabela(cont, {
      dados, porPagina: 25, placeholder: 'Pesquisar por registro, usuário, detalhe…',
      busca: ['usuario_nome', 'id_registro', 'tabela', '_acao', 'detalhes'],
      filtros: [
        { campo: 'acao', titulo: 'Ação', opcoes: Object.entries(this.ACOES).map(([k, v]) => ({ valor: k, rotulo: v })) },
        { campo: 'tabela', titulo: 'Tabela', opcoes: tabelas.map(t => ({ valor: t, rotulo: t })) },
        { campo: 'id_usuario', titulo: 'Usuário', opcoes: usuarios.map(([id, nome]) => ({ valor: id, rotulo: nome })) }
      ],
      colunas: [
        { titulo: 'Data/hora', render: r => `<span class="small">${UI.dataHora(r.data_hora)}</span>` },
        { titulo: 'Usuário', campo: 'usuario_nome' },
        { titulo: 'Ação', render: r => `<span class="chip">${UI.esc(r._acao)}</span>` },
        { titulo: 'Tabela', campo: 'tabela' },
        { titulo: 'Registro', render: r => `<code>${UI.esc(r.id_registro)}</code>` },
        { titulo: '', classe: 'text-end', render: r => r.detalhes && r.detalhes !== '{}' ? `<button class="btn btn-sm btn-outline-secondary" data-det="${r._i}">Detalhes</button>` : '' }
      ]
    });

    cont.addEventListener('click', e => {
      const b = e.target.closest('[data-det]');
      if (!b) return;
      const r = dados[+b.dataset.det];
      let txt = r.detalhes;
      try { txt = JSON.stringify(JSON.parse(r.detalhes), null, 2); } catch (er) { /* mantém texto */ }
      UI.modal({ titulo: `${UI.esc(r._acao)} · ${UI.esc(r.tabela)} ${UI.esc(r.id_registro)}`, tamanho: 'modal-lg', corpo: `<pre class="json">${UI.esc(txt)}</pre>` });
    });
  }
};

</script>
<script>
/* ======== js/modulos/perfil.js ======== */
/**
 * Minha conta — dados pessoais, tema e troca de senha.
 */
Modulos.perfil = {
  render(el, S) {
    const u = S.usuario;
    const temas = [['classico', 'Clássico', 'Azul-marinho e dourado'], ['noturno', 'Noturno', 'Grafite e âmbar'], ['bordo', 'Bordô', 'Verde-escuro e bordô']];
    el.innerHTML = `
      <div class="cabecalho-pagina"><div><h1>Minha conta</h1><p>${UI.esc(u.email)} · ${UI.esc(S.cargo.nome)}</p></div></div>
      <div class="row g-3">
        <div class="col-lg-7"><div class="cartao" id="perfil-dados">
          <h2 class="h6 mb-3">Meus dados</h2>
          <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Nome</label><input class="form-control" data-campo="nome" value="${UI.esc(u.nome)}"></div>
            <div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" data-campo="telefone" data-mascara="telefone" value="${UI.esc(u.telefone)}"></div>
            <div class="col-md-4"><label class="form-label">OAB nº</label><input class="form-control" data-campo="oab_numero" value="${UI.esc(u.oab_numero)}"></div>
            <div class="col-md-2"><label class="form-label">UF</label><input class="form-control" maxlength="2" data-campo="oab_uf" value="${UI.esc(u.oab_uf)}"></div>
            <div class="col-md-6"><label class="form-label">CPF</label><input class="form-control" data-campo="cpf" data-mascara="cpf" value="${UI.esc(u.cpf)}"></div>
            <div class="col-md-4"><label class="form-label">RG</label><input class="form-control" data-campo="rg" value="${UI.esc(u.rg)}"></div>
            <div class="col-md-4"><label class="form-label">Nacionalidade</label><input class="form-control" data-campo="nacionalidade" value="${UI.esc(u.nacionalidade)}"></div>
            ${UI.campo({ rotulo: 'Gênero (para os documentos)', campo: 'genero', valor: u.genero, tipo: 'select', col: 'col-md-4', opcoes: ['Feminino', 'Masculino'], vazio: '-' })}
            ${UI.campo({ rotulo: 'E-mail profissional', campo: 'email_profissional', valor: u.email_profissional, tipo: 'email', col: 'col-md-8' })}
            <div class="col-md-4"><label class="form-label">Estado civil</label><select class="form-select" data-campo="estado_civil">${UI.opcoes(S.listas.estado_civil || [], u.estado_civil, { vazio: '-' })}</select></div>
            <div class="col-12"><label class="form-label">Endereço profissional</label><input class="form-control" data-campo="endereco_profissional" value="${UI.esc(u.endereco_profissional)}"></div>
            <div class="col-12 text-end"><button class="btn btn-primary" data-salvar-dados>Salvar dados</button></div>
          </div>
        </div></div>
        <div class="col-lg-5">
          <div class="cartao mb-3">
            <h2 class="h6 mb-3">Tema</h2>
            ${temas.map(t => `<label class="d-flex align-items-center gap-2 p-2 border rounded mb-2" style="cursor:pointer">
              <input type="radio" name="tema" class="form-check-input mt-0" value="${t[0]}" ${document.documentElement.dataset.tema === t[0] ? 'checked' : ''}>
              <span class="bolinha-tema" data-tema="${t[0]}"></span><span><strong>${t[1]}</strong> <span class="texto-2 small">${t[2]}</span></span></label>`).join('')}
          </div>
          <div class="cartao" id="perfil-senha">
            <h2 class="h6 mb-3">Trocar senha</h2>
            <div class="mb-2"><label class="form-label">Senha atual</label><input type="password" class="form-control" data-campo="senha_atual" autocomplete="current-password"></div>
            <div class="mb-2"><label class="form-label">Nova senha</label><input type="password" class="form-control" data-campo="nova_senha" autocomplete="new-password"></div>
            <div class="mb-3"><label class="form-label">Confirmar nova senha</label><input type="password" class="form-control" data-campo="confirmacao" autocomplete="new-password"></div>
            <button class="btn btn-primary w-100" data-salvar-senha>Trocar senha</button>
          </div>
        </div>
      </div>`;

    Modulos.usuarios.ligarMascaras(el);

    el.querySelectorAll('input[name="tema"]').forEach(r => r.addEventListener('change', () => App.aplicarTema(r.value)));

    el.querySelector('[data-salvar-dados]').onclick = async ev => {
      const d = UI.lerForm(el.querySelector('#perfil-dados'));
      await UI.ocupado(ev.target, async () => {
        try {
          const novo = await Api.chamar('perfil.salvarDados', d);
          Object.assign(App.S.usuario, novo);
          document.getElementById('topo-nome').textContent = novo.nome;
          document.getElementById('avatar-iniciais').textContent = UI.iniciais(novo.nome);
          UI.toast('Dados salvos.');
        } catch (e) { UI.erro(e); }
      });
    };

    el.querySelector('[data-salvar-senha]').onclick = async ev => {
      const box = el.querySelector('#perfil-senha');
      const d = UI.lerForm(box);
      await UI.ocupado(ev.target, async () => {
        try {
          await Api.chamar('auth.trocarSenha', d);
          box.querySelectorAll('input').forEach(i => i.value = '');
          UI.toast('Senha alterada.');
        } catch (e) { UI.erro(e); }
      });
    };
  }
};

</script>
<script>App.iniciar();</script>
</body>
