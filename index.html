<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMA SYS - Advocacia</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Ícones -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { min-height: 100vh; background-color: #1e293b; color: #fff; }
    .sidebar .nav-link { color: #cbd5e1; font-weight: 500; margin-bottom: 0.3rem; border-radius: 0.375rem; cursor: pointer; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #334155; color: #fff; }
    .card-custom { border: none; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .brand-header { font-weight: 700; letter-spacing: 1px; color: #38bdf8; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Menu Lateral -->
    <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 collapse show">
      <div class="d-flex align-items-center mb-4 text-decoration-none">
        <i class="fa-solid fa-scale-balanced fa-2x me-2 text-info"></i>
        <span class="fs-4 brand-header">DMA SYS <small class="fs-6 text-muted d-block">ADV</small></span>
      </div>
      <hr class="text-secondary">
      <ul class="nav flex-column nav-pills" id="mainTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active w-100 text-start" data-bs-toggle="pill" data-bs-target="#content-home">
            <i class="fa-solid fa-chart-line me-2"></i> Dashboard
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link w-100 text-start" data-bs-toggle="pill" data-bs-target="#content-clientes">
            <i class="fa-solid fa-user-tie me-2"></i> Clientes
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link w-100 text-start" data-bs-toggle="pill" data-bs-target="#content-processos">
            <i class="fa-solid fa-folder-open me-2"></i> Processos
          </button>
        </li>
      </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
      <div class="tab-content">
        
        <!-- Dashboard -->
        <div class="tab-pane fade show active" id="content-home">
          <h2 class="mb-4 text-dark fw-bold"><i class="fa-solid fa-gauge me-2 text-primary"></i> Painel Geral</h2>
          <div class="card card-custom p-4 bg-white">
            <p class="text-secondary mb-0">Sistema conectado via API ao Google Sheets da conta admsys.adv@gmail.com.</p>
          </div>
        </div>

        <!-- Clientes -->
        <div class="tab-pane fade" id="content-clientes">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-dark fw-bold mb-0"><i class="fa-solid fa-user-plus me-2 text-primary"></i> Gestão de Clientes</h2>
            <button class="btn btn-outline-secondary btn-sm" onclick="limparFormularioCliente()">
              <i class="fa-solid fa-file-circle-plus me-1"></i> Novo Cadastro
            </button>
          </div>

          <!-- Busca Inteligente de Cliente -->
          <div class="card card-custom p-3 bg-white mb-4 border-start border-4 border-info">
            <label class="form-label font-weight-bold text-dark"><i class="fa-solid fa-magnifying-glass me-1 text-info"></i> Busca Inteligente (ID, Nome, CPF/CNPJ ou RG)</label>
            <div class="row g-2">
              <div class="col-md-10">
                <input type="text" class="form-control" id="busca_cliente_input" oninput="filtrarBuscaClienteTela()" placeholder="Digite o ID (ex: CLI-0001), Nome, CPF ou RG...">
              </div>
              <div class="col-md-2">
                <button class="btn btn-info text-white w-100" onclick="carregarBancoDadosGlobal()">
                  <i class="fa-solid fa-arrows-rotate"></i> Atualizar
                </button>
              </div>
            </div>
            <select class="form-select mt-2 d-none" id="busca_cliente_select" onchange="preencherCamposClienteSelecionado()"></select>
          </div>

          <!-- Form Cadastro / Edição -->
          <div class="card card-custom p-4 bg-white">
            <form id="formCliente" onsubmit="validarESalvarCliente(event)">
              <input type="hidden" id="cli_id_hidden">
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label font-weight-bold">Tipo de Pessoa</label>
                  <select class="form-select" id="cli_tipo" onchange="atualizarMascarasTipo()" required>
                    <option value="PF">Pessoa Física (PF)</option>
                    <option value="PJ">Pessoa Jurídica (PJ)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" id="lbl_nome">Nome Completo</label>
                  <input type="text" class="form-control" id="cli_nome" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label" id="lbl_cpf">CPF</label>
                  <input type="text" class="form-control" id="cli_cpf" oninput="aplicarMascaraDocumento(this)" placeholder="000.000.000-00" required>
                </div>
                <div class="col-md-3">
                  <label class="form-label" id="lbl_rg">RG</label>
                  <input type="text" class="form-control" id="cli_rg">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Estado Civil</label>
                  <select class="form-select" id="cli_estado_civil">
                    <option value="">-- Selecione --</option>
                    <option value="Solteiro(a)">Solteiro(a)</option>
                    <option value="Casado(a)">Casado(a)</option>
                    <option value="Divorciado(a)">Divorciado(a)</option>
                    <option value="Viúvo(a)">Viúvo(a)</option>
                    <option value="União Estável">União Estável</option>
                    <option value="Separado(a) Judicialmente">Separado(a) Judicialmente</option>
                    <option value="Não Aplicável (PJ)">Não Aplicável (PJ)</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Profissão / Atividade</label>
                  <input type="text" class="form-control" id="cli_profissao">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Telefone / WhatsApp</label>
                  <input type="text" class="form-control" id="cli_telefone" oninput="aplicarMascaraTelefone(this)" placeholder="(00) 00000-0000">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Endereço Completo</label>
                  <input type="text" class="form-control" id="cli_endereco">
                </div>
                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="cli_email">
                </div>
                <div class="col-12">
                  <label class="form-label">Observações</label>
                  <textarea class="form-control" id="cli_obs" rows="2"></textarea>
                </div>
                <div class="col-12 text-end">
                  <button type="submit" class="btn btn-primary px-4" id="btnSalvarCli">
                    <i class="fa-solid fa-save me-1"></i> Salvar Cliente
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Processos -->
        <div class="tab-pane fade" id="content-processos">
          <h2 class="mb-4 text-dark fw-bold"><i class="fa-solid fa-gavel me-2 text-primary"></i> Cadastrar Processo</h2>
          <div class="card card-custom p-4 bg-white">
            <form id="formProcesso" onsubmit="salvarProcesso(event)">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Buscar / Selecionar Cliente (por ID, Nome, CPF ou RG)</label>
                  <input type="text" class="form-control mb-2" id="proc_busca_cliente" oninput="filtrarListaClientesProcesso()" placeholder="Digite para buscar...">
                  <select class="form-select" id="proc_id_cliente" required>
                    <option value="">Aguardando seleção...</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Número do Processo (CNJ)</label>
                  <input type="text" class="form-control" id="proc_num" placeholder="0000000-00.2026.8.26.0000" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Tipo de Ação</label>
                  <select class="form-select" id="proc_tipo" required>
                    <option value="">-- Selecione a Área/Ação --</option>
                    <option value="Trabalhista">Trabalhista</option>
                    <option value="Cível Geral">Cível Geral</option>
                    <option value="Família e Sucessões">Família e Sucessões</option>
                    <option value="Tributário">Tributário</option>
                    <option value="Previdenciário">Previdenciário</option>
                    <option value="Criminal / Penal">Criminal / Penal</option>
                    <option value="Direito do Consumidor">Direito do Consumidor</option>
                    <option value="Empresarial / Societário">Empresarial / Societário</option>
                    <option value="Outros">Outros</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Polo</label>
                  <select class="form-select" id="proc_polo">
                    <option value="Autor">Polo Ativo (Autor)</option>
                    <option value="Réu">Polo Passivo (Réu)</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Parte Contrária</label>
                  <input type="text" class="form-control" id="proc_parte_contraria">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Vara / Tribunal</label>
                  <input type="text" class="form-control" id="proc_vara">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Valor Causa (R$)</label>
                  <input type="text" class="form-control" id="proc_valor">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Honorários Combinados</label>
                  <input type="text" class="form-control" id="proc_honorarios">
                </div>
                <div class="col-12 text-end">
                  <button type="submit" class="btn btn-success px-4" id="btnSalvarProc">
                    <i class="fa-solid fa-save me-1"></i> Cadastrar Processo
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzmREya4ujybG5vN_2ivDF7E8JZGbHdLW8gsQkTHCrj4FzT23m_zVWmNz6uJUaghetLrA/exec";
  let dbClientes = [];

  function atualizarMascarasTipo() {
    const tipo = document.getElementById('cli_tipo').value;
    const inputCpf = document.getElementById('cli_cpf');
    const lblCpf = document.getElementById('lbl_cpf');
    const lblNome = document.getElementById('lbl_nome');
    const lblRg = document.getElementById('lbl_rg');
    const selectEstadoCivil = document.getElementById('cli_estado_civil');

    if (tipo === 'PJ') {
      lblNome.innerText = "Razão Social";
      lblCpf.innerText = "CNPJ";
      lblRg.innerText = "Inscrição Estadual (IE)";
      inputCpf.placeholder = "00.000.000/0000-00";
      if(!selectEstadoCivil.value) selectEstadoCivil.value = "Não Aplicável (PJ)";
    } else {
      lblNome.innerText = "Nome Completo";
      lblCpf.innerText = "CPF";
      lblRg.innerText = "RG";
      inputCpf.placeholder = "000.000.000-00";
    }
  }

  function aplicarMascaraDocumento(input) {
    let v = input.value.replace(/\D/g, "");
    const tipo = document.getElementById('cli_tipo').value;

    if (tipo === 'PF') {
      v = v.substring(0, 11);
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d)/, "$1.$2");
      v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    } else {
      v = v.substring(0, 14);
      v = v.replace(/^(\d{2})(\d)/, "$1.$2");
      v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
      v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
      v = v.replace(/(\d{4})(\d)/, "$1-$2");
    }
    input.value = v;
  }

  function aplicarMascaraTelefone(input) {
    let v = input.value.replace(/\D/g, "").substring(0, 11);
    if (v.length > 10) {
      v = v.replace(/^(\d\d)(\d{5})(\d\d\d\d)$/, "($1) $2-$3");
    } else if (v.length > 5) {
      v = v.replace(/^(\d\d)(\d{4})(\d{0,4})$/, "($1) $2-$3");
    } else if (v.length > 2) {
      v = v.replace(/^(\d\d)(\d{0,5})$/, "($1) $2");
    }
    input.value = v;
  }

  function carregarBancoDadosGlobal() {
    const oldScript = document.getElementById('jsonp_db');
    if (oldScript) oldScript.remove();

    window.cbBancoCompleto = function(res) {
      if (res && res.success && res.data) {
        dbClientes = res.data;
        renderizarOptionsProcessos(dbClientes);
      }
    };

    const script = document.createElement('script');
    script.id = 'jsonp_db';
    script.src = API_URL + "?action=getClientesCompleto&callback=cbBancoCompleto&t=" + new Date().getTime();
    document.body.appendChild(script);
  }

  function filtrarBuscaClienteTela() {
    const termo = document.getElementById('busca_cliente_input').value.toLowerCase().trim();
    const select = document.getElementById('busca_cliente_select');

    if (!termo) {
      select.classList.add('d-none');
      return;
    }

    const encontrados = dbClientes.filter(function(c) {
      return String(c.id).toLowerCase().indexOf(termo) !== -1 ||
             String(c.nome_razao).toLowerCase().indexOf(termo) !== -1 ||
             String(c.cpf_cnpj).replace(/\D/g, "").indexOf(termo.replace(/\D/g, "")) !== -1 ||
             String(c.rg_ie).toLowerCase().indexOf(termo) !== -1;
    });

    if (encontrados.length > 0) {
      select.innerHTML = '<option value="">-- Clique para selecionar e preencher os campos --</option>';
      encontrados.forEach(function(c) {
        select.innerHTML += '<option value="' + c.id + '">[' + c.id + '] ' + c.nome_razao + ' - Doc: ' + c.cpf_cnpj + '</option>';
      });
      select.classList.remove('d-none');
    } else {
      select.innerHTML = '<option value="">Nenhum cliente encontrado com esse termo</option>';
      select.classList.remove('d-none');
    }
  }

  function preencherCamposClienteSelecionado() {
    const id = document.getElementById('busca_cliente_select').value;
    if (!id) return;

    const cliente = dbClientes.find(function(c) { return c.id === id; });
    if (cliente) {
      document.getElementById('cli_id_hidden').value = cliente.id;
      document.getElementById('cli_tipo').value = cliente.tipo || 'PF';
      atualizarMascarasTipo();
      
      document.getElementById('cli_nome').value = cliente.nome_razao || '';
      document.getElementById('cli_cpf').value = cliente.cpf_cnpj || '';
      document.getElementById('cli_rg').value = cliente.rg_ie || '';
      document.getElementById('cli_estado_civil').value = cliente.estado_civil || '';
      document.getElementById('cli_profissao').value = cliente.profissao || '';
      document.getElementById('cli_telefone').value = cliente.telefone || '';
      document.getElementById('cli_endereco').value = cliente.endereco || '';
      document.getElementById('cli_email').value = cliente.email || '';
      document.getElementById('cli_obs').value = cliente.obs || '';

      document.getElementById('busca_cliente_select').classList.add('d-none');
      alert('Dados do cliente [' + cliente.id + '] preenchidos na tela! Você pode alterar os campos e clicar em Salvar para atualizar.');
    }
  }

  function limparFormularioCliente() {
    document.getElementById('cli_id_hidden').value = '';
    document.getElementById('formCliente').reset();
    document.getElementById('busca_cliente_input').value = '';
    document.getElementById('busca_cliente_select').classList.add('d-none');
    atualizarMascarasTipo();
  }

  async function enviarDados(payload, btnElement, formElement) {
    btnElement.disabled = true;
    btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Processando...';

    const formData = new FormData();
    formData.append('data', JSON.stringify(payload));

    try {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      });

      alert('Registro gravado com sucesso no banco de dados!');
      if (formElement) formElement.reset();
      limparFormularioCliente();
      carregarBancoDadosGlobal();
    } catch (err) {
      alert('Erro ao enviar dados: ' + err);
    } finally {
      btnElement.disabled = false;
      btnElement.innerHTML = '<i class="fa-solid fa-save me-1"></i> Salvar';
    }
  }

  function validarESalvarCliente(e) {
    e.preventDefault();
    const docInput = document.getElementById('cli_cpf').value.replace(/\D/g, "");
    const idAtual = document.getElementById('cli_id_hidden').value;

    const existente = dbClientes.find(function(c) {
      return String(c.cpf_cnpj).replace(/\D/g, "") === docInput && docInput !== "" && c.id !== idAtual;
    });

    if (existente) {
      const confirma = confirm("ATENÇÃO DE DUPLICIDADE:\n\nJá existe um cliente cadastrado com este documento!\n\nID: " + existente.id + "\nNome: " + existente.nome_razao + "\n\nDeseja ATUALIZAR o cadastro deste cliente com as novas informações?");
      if (!confirma) return;
      document.getElementById('cli_id_hidden').value = existente.id;
    }

    salvarCliente();
  }

  function salvarCliente() {
    const btn = document.getElementById('btnSalvarCli');
    const form = document.getElementById('formCliente');

    const payload = {
      action: 'salvarCliente',
      payload: {
        id_cliente: document.getElementById('cli_id_hidden').value,
        tipo: document.getElementById('cli_tipo').value,
        nome_razao: document.getElementById('cli_nome').value,
        cpf_cnpj: document.getElementById('cli_cpf').value,
        rg_ie: document.getElementById('cli_rg').value,
        estado_civil: document.getElementById('cli_estado_civil').value,
        profissao: document.getElementById('cli_profissao').value,
        telefone: document.getElementById('cli_telefone').value,
        endereco: document.getElementById('cli_endereco').value,
        email: document.getElementById('cli_email').value,
        obs: document.getElementById('cli_obs').value
      }
    };

    enviarDados(payload, btn, form);
  }

  function salvarProcesso(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSalvarProc');
    const form = document.getElementById('formProcesso');

    const payload = {
      action: 'cadastrarProcesso',
      payload: {
        id_cliente: document.getElementById('proc_id_cliente').value,
        num_processo: document.getElementById('proc_num').value,
        acao_tipo: document.getElementById('proc_tipo').value,
        polo: document.getElementById('proc_polo').value,
        parte_contraria: document.getElementById('proc_parte_contraria').value,
        vara_tribunal: document.getElementById('proc_vara').value,
        valor_causa: document.getElementById('proc_valor').value,
        honorarios: document.getElementById('proc_honorarios').value
      }
    };

    enviarDados(payload, btn, form);
  }

  function renderizarOptionsProcessos(lista) {
    const select = document.getElementById('proc_id_cliente');
    if (!lista || lista.length === 0) {
      select.innerHTML = '<option value="">Nenhum cliente cadastrado no banco</option>';
      return;
    }
    select.innerHTML = '<option value="">-- Selecione o Cliente --</option>';
    lista.forEach(function(c) {
      const doc = c.cpf_cnpj ? ' - Doc: ' + c.cpf_cnpj : '';
      select.innerHTML += '<option value="' + c.id + '">[' + c.id + '] ' + c.nome_razao + doc + '</option>';
    });
  }

  function filtrarListaClientesProcesso() {
    const termo = document.getElementById('proc_busca_cliente').value.toLowerCase().trim();
    if (!termo) {
      renderizarOptionsProcessos(dbClientes);
      return;
    }

    const filtrados = dbClientes.filter(function(c) {
      return String(c.id).toLowerCase().indexOf(termo) !== -1 ||
             String(c.nome_razao).toLowerCase().indexOf(termo) !== -1 ||
             String(c.cpf_cnpj).replace(/\D/g, "").indexOf(termo.replace(/\D/g, "")) !== -1 ||
             String(c.rg_ie).toLowerCase().indexOf(termo) !== -1;
    });

    renderizarOptionsProcessos(filtrados);
  }

  window.onload = function() {
    carregarBancoDadosGlobal();
  };
</script>
</body>
</html>
