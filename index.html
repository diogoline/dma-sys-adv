<!-- PAINEL SUPERIOR COM CARDS RESUMO (Dashboard) -->
<div class="row g-3 mb-4">
  <div class="col-md-3">
    <div class="card card-custom p-3 bg-white border-start border-4 border-primary">
      <small class="text-muted font-weight-bold">Total de Clientes</small>
      <h3 class="fw-bold mb-0 text-dark" id="dash_total_clientes">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card card-custom p-3 bg-white border-start border-4 border-success">
      <small class="text-muted font-weight-bold">Processos Ativos</small>
      <h3 class="fw-bold mb-0 text-dark" id="dash_total_processos">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card card-custom p-3 bg-white border-start border-4 border-info">
      <small class="text-muted font-weight-bold">Unidade Bem Bom</small>
      <h3 class="fw-bold mb-0 text-dark" id="dash_total_bembom">0</h3>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card card-custom p-3 bg-white border-start border-4 border-warning">
      <small class="text-muted font-weight-bold">Unidade Casa Nova</small>
      <h3 class="fw-bold mb-0 text-dark" id="dash_total_casanova">0</h3>
    </div>
  </div>
</div>

<!-- GRADE / TABELA DE PROCESSOS COM FILTROS INTELIGENTES -->
<div class="card card-custom p-4 bg-white mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-dark mb-0"><i class="fa-solid fa-list-check text-primary me-2"></i> Processos Cadastrados</h4>
    <button class="btn btn-outline-primary btn-sm" onclick="carregarBancoDadosGlobal()">
      <i class="fa-solid fa-arrows-rotate me-1"></i> Atualizar Lista
    </button>
  </div>

  <!-- Barra de Filtros Inteligentes -->
  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <input type="text" class="form-control" id="grid_search_input" onkeyup="filtrarGradeProcessos()" placeholder="🔍 Buscar por Cliente, CNJ, CPF, Ação ou Parte Contrária...">
    </div>
    <div class="col-md-3">
      <select class="form-select" id="grid_filter_unidade" onchange="filtrarGradeProcessos()">
        <option value="">Todas as Unidades</option>
        <option value="Bem Bom">Unidade Bem Bom</option>
        <option value="Casa Nova">Unidade Casa Nova</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="grid_filter_status" onchange="filtrarGradeProcessos()">
        <option value="">Todos os Status</option>
        <option value="Em Andamento">Em Andamento</option>
        <option value="Aguardando Assinatura">Aguardando Assinatura</option>
        <option value="Concluído">Concluído</option>
      </select>
    </div>
  </div>

  <!-- Tabela de Dados -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>ID Processo</th>
          <th>Cliente</th>
          <th>Nº Processo (CNJ)</th>
          <th>Tipo / Área</th>
          <th>Polo</th>
          <th>Status</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody id="grid_processos_body">
        <tr>
          <td colspan="7" class="text-center text-muted py-4">Nenhum processo carregado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
