        <div class="col-12"><div class="d-flex justify-content-between align-items-end"><label class="form-label mb-1">Poderes gerais</label>${blocoPadrao('poderes_gerais')}</div>
          <textarea class="form-control" rows="5" data-campo="poderes_gerais">${UI.esc(v.poderes_gerais)}</textarea></div>
        <div class="col-12"><div class="d-flex justify-content-between align-items-end"><label class="form-label mb-1">Poderes especiais</label>${blocoPadrao('poderes_especiais')}</div>
          <textarea class="form-control" rows="5" data-campo="poderes_especiais">${UI.esc(v.poderes_especiais)}</textarea>
          <div class="form-text">Trechos como [PREENCHER] devem ser trocados pelos dados do caso. {{caso.parte_contraria}} é preenchido automaticamente.</div></div>
        ${UI.campo({ rotulo: 'Observações internas', campo: 'obs', valor: v.obs, tipo: 'textarea', col: 'col-12', linhas: 2 })}
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });

    const $ = c => m.el.querySelector(`[data-campo="${c}"]`);
    const texto = $('honorarios_texto');
    let textoManual = !!v.honorarios_texto;
    texto.addEventListener('input', () => { textoManual = true; });
    const atualizarPrevia = () => {
      const f = UI.lerForm(m.el);
      const ps = DocGen.previaParcelas(f);
      m.el.querySelector('[data-previa-parcelas]').innerHTML = ps.length
        ? ps.map(p => `<span class="chip me-1 mb-1">${p.numero} · ${UI.data(p.vencimento)} · ${DocGen.moeda(p.valor)}</span>`).join('')
        : '<span class="texto-2">Nenhuma (só êxito).</span>';
      if (!textoManual) texto.value = DocGen.textoHonorarios(f);
    };
    ['tipo_honorario', 'valor_entrada', 'valor_fixo', 'n_parcelas', 'dia_vencimento', 'perc_exito', 'data_primeira_parcela', 'data_contrato']
      .forEach(c => $(c).addEventListener('input', atualizarPrevia));
    m.el.querySelector('[data-gerar-texto]').onclick = () => { textoManual = false; atualizarPrevia(); };
    atualizarPrevia();

    m.el.querySelectorAll('[data-padrao]').forEach(b => b.onclick = async () => {
      const p = padroes.find(x => x.id === b.dataset.padrao);
      const alvo = $(b.dataset.destino);
      if (alvo.value.trim() && !await UI.confirmar('Substituir o texto atual pelo texto padrão?', { botao: 'Substituir' })) return;
      alvo.value = p.texto;
    });

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const d = UI.lerForm(m.el);
      if (k) d.id_contrato = k.id_contrato;
      d.id_caso = caso ? caso.id_caso : ((d._caso || '').match(/\[(CAS-\d+)\]\s*$/) || [])[1];
      delete d._caso;
      d.advogados = [...m.el.querySelectorAll('[data-adv]:checked')].map(i => i.value).join(',');
      if (!d.id_caso) return UI.toast('Escolha o caso na lista de sugestões.', 'aviso');
      if (!d.advogados) return UI.toast('Marque pelo menos um advogado.', 'aviso');
      if (!d.objeto) return UI.toast('Preencha o objeto do contrato.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try {
          const salvo = await Api.chamar('contratos.salvar', d);
          m.fechar(); UI.toast(k ? 'Contrato atualizado.' : 'Contrato criado.');
          if (aoSalvar) aoSalvar(salvo);
        } catch (e) { UI.erro(e); }
      });
    };
  },

  async ficha(el, S, id) {
    el.innerHTML = '<div class="vazio"><div class="spinner-border"></div></div>';
    let F;
    try { F = await Api.chamar('contratos.ficha', { id_contrato: id }); }
    catch (e) { el.innerHTML = `<div class="cartao"><div class="vazio"><i class="bi bi-lock"></i>${UI.esc(e.message)}</div></div>`; return; }
    const k = F.contrato, caso = F.caso || {}, cli = F.cliente || {};
    caso.cliente_nome = cli.nome_razao;
    const editavel = ['Rascunho', 'Aguardando assinatura'].includes(k.status);
    const podeEditar = App.pode('contratos', 'editar');
    const podePagar = App.pode('financeiro', 'editar');
    const advs = String(k.advogados || '').split(',').filter(Boolean).map(id => App.nomeUsuario(id));
    const totalP = F.parcelas.filter(p => p.status !== 'Cancelada').reduce((s, p) => s + DocGen.num(p.valor), 0);
    const pago = F.parcelas.reduce((s, p) => s + DocGen.num(p.valor_pago), 0);
    const hoje = UI.hojeISO();
    const comParte = t => DocGen.texto(String(t || '').replace(/\{\{\s*caso\.parte_contraria\s*\}\}/g, caso.parte_contraria || '[parte contrária]'));

    const botoes = [];
    if (podeEditar && editavel) botoes.push('<button class="btn btn-outline-secondary" data-acao="editar"><i class="bi bi-pencil me-1"></i>Editar</button>');
    if (podeEditar && k.status === 'Rascunho') botoes.push('<button class="btn btn-outline-primary" data-status="Aguardando assinatura">Enviar para assinatura</button>');
    if (podeEditar && k.status === 'Aguardando assinatura') botoes.push('<button class="btn btn-outline-secondary" data-status="Rascunho">Voltar para rascunho</button>', '<button class="btn btn-primary" data-acao="assinar"><i class="bi bi-check2-circle me-1"></i>Marcar como assinado</button>');
    if (podeEditar && k.status === 'Assinado') botoes.push('<button class="btn btn-outline-secondary" data-status="Encerrado">Encerrar</button>');
    if (podeEditar && k.status !== 'Cancelado' && k.status !== 'Encerrado') botoes.push('<button class="btn btn-outline-danger" data-status="Cancelado">Cancelar</button>');

    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div>
          <div class="small"><a href="#/contratos" class="link-limpo texto-2"><i class="bi bi-arrow-left"></i> Contratos</a></div>
          <h1>Contrato ${UI.esc(k.id_contrato)} ${this.chip(k.status)}</h1>
          <p><a class="link-limpo" href="#/clientes/${UI.esc(k.id_cliente)}">${UI.esc(cli.nome_razao || k.id_cliente)}</a> ·
             <a class="link-limpo" href="#/casos/${UI.esc(k.id_caso)}">${UI.esc(caso.titulo || k.id_caso)}</a> · ${UI.data(k.data_contrato)}</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">${botoes.join('')}</div>
      </div>
      ${k.status === 'Assinado' ? `<div class="alert alert-success small py-2"><i class="bi bi-patch-check me-1"></i>Assinado em ${UI.data(k.data_assinatura)}${k.tipo_assinatura ? ' · ' + UI.esc(k.tipo_assinatura) : ''}${k.id_doc_assinado ? ' · <button class="btn btn-link btn-sm p-0 align-baseline" data-baixar-assinado>baixar via assinada</button>' : ''}</div>` : ''}
      <div class="row g-3">
        <div class="col-lg-6"><div class="cartao h-100">
          <h2 class="h6 mb-3">Honorários</h2>
          <div class="campo-info mb-2"><div class="rotulo">Tipo · resumo</div><div class="valor">${UI.esc(k.tipo_honorario || '-')} · ${UI.esc(this.resumoHonorarios(k))}</div></div>
          <div class="campo-info mb-3"><div class="rotulo">Cláusula 5ª</div><div class="valor small">${DocGen.texto(k.honorarios_texto) || '-'}</div></div>
          <div class="d-flex justify-content-between small mb-1"><strong>Parcelas</strong><span class="texto-2">recebido ${DocGen.moeda(pago)} de ${DocGen.moeda(totalP)}</span></div>
          ${F.parcelas.length ? `<table class="table table-sm align-middle mb-0"><tbody>${F.parcelas.map(p => {
            const venc = p.status === 'Em aberto' && p.vencimento < hoje;
            return `<tr><td class="small">${p.numero === '0' ? 'Entrada' : p.numero + 'ª'}</td>
              <td class="small ${venc ? 'text-danger fw-semibold' : ''}">${UI.data(p.vencimento)}</td>
              <td class="small">${DocGen.moeda(DocGen.num(p.valor))}</td>
              <td>${p.status === 'Paga' ? `<span class="chip chip-ok">paga ${UI.data(p.data_pagamento)}</span>` : p.status === 'Cancelada' ? '<span class="chip chip-off">cancelada</span>' : `<span class="chip ${venc ? 'chip-off' : ''}">${UI.esc(p.status)}</span>`}</td>
              <td class="text-end">${podePagar && !['Paga', 'Cancelada'].includes(p.status) ? `<button class="btn btn-sm btn-outline-success" data-pagar="${UI.esc(p.id_parcela)}">Registrar pagamento</button>` : ''}</td></tr>`;
          }).join('')}</tbody></table>` : '<div class="texto-2 small">Sem parcelas fixas (somente êxito).</div>'}
        </div></div>
        <div class="col-lg-6"><div class="cartao mb-3">
          <h2 class="h6 mb-2">Gerar documentos</h2>
          <div class="d-flex flex-wrap gap-2">${F.modelos.map(mo => `<button class="btn btn-outline-secondary btn-sm" data-modelo="${UI.esc(mo.id)}"><i class="bi bi-file-earmark-text me-1"></i>${UI.esc(mo.nome)}</button>`).join('') || '<span class="texto-2 small">Nenhum modelo ativo.</span>'}</div>
          <div class="form-text">Abre a prévia para imprimir, salvar em PDF ou baixar para o Word. Depois de assinado, anexe a via assinada abaixo.</div>
        </div>
        <div class="cartao">
          <h2 class="h6 mb-2">Documentos do contrato</h2>
          <div data-docs></div>
        </div></div>
        <div class="col-12"><div class="cartao">
          <h2 class="h6 mb-2">Objeto e poderes</h2>
          <div class="campo-info mb-2"><div class="rotulo">Advogados</div><div class="valor">${UI.esc(advs.join(', ') || '-')}</div></div>
          <div class="campo-info mb-2"><div class="rotulo">Objeto</div><div class="valor">${DocGen.texto(k.objeto) || '-'}</div></div>
          <div class="campo-info mb-2"><div class="rotulo">Poderes gerais</div><div class="valor small">${comParte(k.poderes_gerais) || '<span class="texto-2">não preenchido</span>'}</div></div>
          <div class="campo-info"><div class="rotulo">Poderes especiais</div><div class="valor small">${comParte(k.poderes_especiais) || '<span class="texto-2">não preenchido</span>'}</div></div>
          ${k.obs ? `<div class="campo-info mt-2"><div class="rotulo">Observações</div><div class="valor small" style="white-space:pre-wrap">${UI.esc(k.obs)}</div></div>` : ''}
        </div></div>
      </div>`;

    const recarregar = () => this.ficha(el, S, id);
    Modulos.documentos.painel(el.querySelector('[data-docs]'), { id_contrato: k.id_contrato }, { tipoPadrao: 'Contrato de honorários' });

    el.querySelectorAll('[data-acao="editar"]').forEach(b => b.onclick = () => this.formulario(k, S, { caso }, recarregar));
    el.querySelectorAll('[data-status]').forEach(b => b.onclick = async () => {
      const st = b.dataset.status;
      const aviso = st === 'Cancelado' ? 'Cancelar o contrato? As parcelas em aberto serão canceladas.' : `Mudar o status para "${st}"?`;
      if (!await UI.confirmar(aviso, { perigo: st === 'Cancelado', botao: 'Confirmar' })) return;
      try { await Api.chamar('contratos.alterarStatus', { id_contrato: k.id_contrato, status: st }); UI.toast('Status atualizado.'); recarregar(); } catch (e) { UI.erro(e); }
    });
    el.querySelectorAll('[data-acao="assinar"]').forEach(b => b.onclick = () => this.modalAssinatura(k, recarregar));
    el.querySelectorAll('[data-pagar]').forEach(b => b.onclick = () => this.modalPagamento(F.parcelas.find(p => p.id_parcela === b.dataset.pagar), recarregar));
    const ba = el.querySelector('[data-baixar-assinado]');
    if (ba) ba.onclick = () => Modulos.documentos.baixar(k.id_doc_assinado, ba);
    el.querySelectorAll('[data-modelo]').forEach(b => b.onclick = async () => {
      await UI.ocupado(b, async () => {
        try {
          const D = await Api.chamar('contratos.dadosDocumento', { id_contrato: k.id_contrato, id_modelo: b.dataset.modelo });
          const nome = `${D.modelo.nome} - ${(cli.nome_razao || '').split(' ')[0]} - ${k.id_contrato}`;
          DocGen.abrirPrevia(DocGen.render(D.modelo.conteudo_html, D), D.modelo.nome, nome.replace(/[\\/:*?"<>|]/g, ''));
        } catch (e) { UI.erro(e); }
      });
    });
  },

  async modalAssinatura(k, aoSalvar) {
    let docs = [];
    try { docs = await Api.chamar('documentos.listar', { id_contrato: k.id_contrato }); } catch (e) { /* segue */ }
    const m = UI.modal({
      titulo: 'Marcar contrato como assinado',
      corpo: `<div class="row g-3">
        ${UI.campo({ rotulo: 'Data da assinatura', campo: 'data_assinatura', valor: UI.hojeISO(), tipo: 'date', col: 'col-md-6', obrig: true })}
        ${UI.campo({ rotulo: 'Forma de assinatura', campo: 'tipo_assinatura', tipo: 'select', col: 'col-md-6', vazio: null,
          opcoes: ['Física (papel)', 'Gov.br (assinatura avançada)', 'Certificado digital ICP-Brasil', 'Outra'] })}
        ${UI.campo({ rotulo: 'Via assinada (anexo)', campo: 'id_doc_assinado', tipo: 'select', col: 'col-12', vazio: docs.length ? 'Selecione' : 'Nenhum anexo ainda',
          opcoes: docs.map(d => ({ id: d.id_documento, nome: `${d.nome} (${d.tipo})` })),
          ajuda: 'Recomendado: anexe o PDF ou a foto do contrato assinado antes, em "Documentos do contrato".' })}
      </div>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-ok>Confirmar assinatura</button>`
    });
    m.el.querySelector('[data-ok]').onclick = async ev => {
      const d = Object.assign(UI.lerForm(m.el), { id_contrato: k.id_contrato, status: 'Assinado' });
      if (!d.data_assinatura) return UI.toast('Informe a data.', 'aviso');
      if (!d.id_doc_assinado && !await UI.confirmar('Confirmar sem anexar a via assinada? Você pode anexar depois, mas fica sem o vínculo.', { botao: 'Confirmar mesmo assim' })) return;
      await UI.ocupado(ev.target, async () => {
        try { await Api.chamar('contratos.alterarStatus', d); m.fechar(); UI.toast('Contrato assinado.'); aoSalvar(); } catch (e) { UI.erro(e); }
      });
    };
  },

  modalPagamento(p, aoSalvar) {
    const m = UI.modal({
      titulo: `Registrar pagamento — ${p.numero === '0' ? 'entrada' : 'parcela ' + p.numero}`,
      corpo: `<div class="row g-3">
        ${UI.campo({ rotulo: 'Valor pago (R$)', campo: 'valor_pago', valor: String(DocGen.num(p.valor).toFixed(2)).replace('.', ','), col: 'col-md-4', attrs: 'inputmode="decimal"' })}
        ${UI.campo({ rotulo: 'Data do pagamento', campo: 'data_pagamento', valor: UI.hojeISO(), tipo: 'date', col: 'col-md-4' })}
        ${UI.campo({ rotulo: 'Forma', campo: 'forma_pagamento', tipo: 'select', col: 'col-md-4', opcoes: App.lista('forma_pagamento'), vazio: '-' })}
      </div>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-success" data-ok>Registrar</button>`
    });
    m.el.querySelector('[data-ok]').onclick = async ev => {
      const d = Object.assign(UI.lerForm(m.el), { id_parcela: p.id_parcela });
      await UI.ocupado(ev.target, async () => {
        try { await Api.chamar('contratos.registrarPagamento', d); m.fechar(); UI.toast('Pagamento registrado.'); aoSalvar(); } catch (e) { UI.erro(e); }
      });
    };
  }
};

</script>
<script>
/* ======== js/modulos/clientes.js ======== */
/**
 * Clientes — lista, cadastro (PF/PJ) e ficha com casos e atendimentos.
 * Rotas: #/clientes  e  #/clientes/CLI-000001
 */
Modulos.clientes = {
  dados: [],

  render(el, S, param) {
    return param ? this.ficha(el, S, param) : this.lista(el, S);
  },

  /** Lista usada também por outros módulos (seleção de cliente) */
  async carregarLista() {
    this.dados = await Api.chamar('clientes.listar');
    return this.dados;
  },

  opcaoDatalist(c) { return `${c.nome_razao}${c.cpf_cnpj ? ' — ' + c.cpf_cnpj : ''} [${c.id_cliente}]`; },
  idDoDatalist(txt) { const m = String(txt || '').match(/\[(CLI-\d+)\]\s*$/); return m ? m[1] : ''; },

  async lista(el, S) {
    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div><h1>Clientes</h1><p>Pessoas físicas e jurídicas atendidas pelo escritório</p></div>
        <div class="d-flex gap-2">
          ${App.pode('clientes', 'exportar') ? '<button class="btn btn-outline-secondary" data-exportar><i class="bi bi-download me-1"></i>Exportar</button>' : ''}
          ${App.pode('clientes', 'criar') ? '<button class="btn btn-primary" data-novo><i class="bi bi-plus-lg me-1"></i>Novo cliente</button>' : ''}
        </div>
      </div>
      <div class="cartao" id="cli-tabela"><div class="vazio"><div class="spinner-border"></div></div></div>`;

    const novo = el.querySelector('[data-novo]');
    if (novo) novo.onclick = () => this.formulario(null, S, c => { location.hash = '#/clientes/' + c.id_cliente; });

    try { await this.carregarLista(); } catch (e) { return UI.erro(e); }

    const exp = el.querySelector('[data-exportar]');
    if (exp) exp.onclick = () => UI.exportarCSV('clientes', [
      { titulo: 'ID', campo: 'id_cliente' }, { titulo: 'Tipo', campo: 'tipo' }, { titulo: 'Nome/Razão social', campo: 'nome_razao' },
      { titulo: 'CPF/CNPJ', campo: 'cpf_cnpj' }, { titulo: 'Telefone', campo: 'telefone' }, { titulo: 'WhatsApp', campo: 'whatsapp' },
      { titulo: 'E-mail', campo: 'email' }, { titulo: 'Cidade', campo: 'cidade' }, { titulo: 'UF', campo: 'uf' },
      { titulo: 'Unidade', valor: r => App.nomeUnidade(r.id_unidade) }, { titulo: 'Responsável', valor: r => App.nomeUsuario(r.id_responsavel) },
      { titulo: 'Casos ativos', campo: 'casos_ativos' }, { titulo: 'Situação', valor: r => r.ativo === 'NAO' ? 'Inativo' : 'Ativo' }
    ], this.dados);

    this.dados.forEach(c => { c._ativos = c.casos_ativos > 0 ? 'COM' : 'SEM'; });
    UI.tabela(el.querySelector('#cli-tabela'), {
      dados: this.dados,
      placeholder: 'Pesquisar por nome, CPF/CNPJ, telefone, cidade, NIT…',
      busca: ['nome_razao', 'nome_fantasia', 'cpf_cnpj', 'telefone', 'whatsapp', 'email', 'cidade', 'nit_pis', 'id_cliente'],
      filtros: [
        { campo: 'tipo', titulo: 'Tipo', opcoes: [{ valor: 'PF', rotulo: 'Pessoa física' }, { valor: 'PJ', rotulo: 'Pessoa jurídica' }] },
        { campo: 'id_unidade', titulo: 'Unidade', opcoes: S.unidades.map(u => ({ valor: u.id, rotulo: u.nome })) },
        { campo: 'id_responsavel', titulo: 'Responsável', opcoes: S.usuarios.map(u => ({ valor: u.id, rotulo: u.nome })) },
        { campo: '_ativos', titulo: 'Casos', opcoes: [{ valor: 'COM', rotulo: 'Com casos ativos' }, { valor: 'SEM', rotulo: 'Sem casos ativos' }] },
        { campo: 'ativo', titulo: 'Situação', opcoes: [{ valor: 'SIM', rotulo: 'Ativos' }, { valor: 'NAO', rotulo: 'Inativos' }] }
      ],
      linhaClasse: r => r.ativo === 'NAO' ? 'linha-inativa' : '',
      colunas: [
        { titulo: 'Cliente', render: r => `<a class="link-limpo fw-semibold" href="#/clientes/${UI.esc(r.id_cliente)}">${UI.esc(r.nome_razao)}</a>
            <div class="small texto-2">${r.tipo} · ${UI.esc(App.nomeUnidade(r.id_unidade))}</div>` },
        { titulo: 'CPF/CNPJ', render: r => UI.esc(r.cpf_cnpj || '-') },
        { titulo: 'Contato', render: r => {
            const tel = r.whatsapp || r.telefone; const wa = UI.linkWhats(tel);
            return tel ? `${UI.esc(tel)} ${wa ? `<a href="${wa}" target="_blank" rel="noopener" title="WhatsApp"><i class="bi bi-whatsapp text-success"></i></a>` : ''}` : '<span class="texto-2">-</span>';
          } },
        { titulo: 'Casos', render: r => r.casos_ativos ? `<span class="chip chip-ok">${r.casos_ativos} ativo(s)</span>` : '<span class="chip">nenhum</span>' },
        { titulo: 'Responsável', render: r => `<span class="small">${UI.esc(App.nomeUsuario(r.id_responsavel))}</span>` },
        { titulo: '', classe: 'text-end', render: r => `<a class="btn btn-sm btn-outline-secondary" href="#/clientes/${UI.esc(r.id_cliente)}">Abrir</a>` }
      ]
    });
  },

  formulario(c, S, aoSalvar) {
    const v = c || { tipo: 'PF', nacionalidade: 'brasileiro(a)', id_responsavel: S.usuario.id_usuario, id_unidade: S.usuario.id_unidade };
    const ufs = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
    const m = UI.modal({
      titulo: c ? 'Editar cliente' : 'Novo cliente',
      tamanho: 'modal-xl',
      corpo: `<form class="row g-3" novalidate>
        ${UI.secao('Identificação')}
        ${UI.campo({ rotulo: 'Tipo', campo: 'tipo', tipo: 'select', valor: v.tipo, vazio: null, col: 'col-md-2', opcoes: [{ id: 'PF', nome: 'Pessoa física' }, { id: 'PJ', nome: 'Pessoa jurídica' }] })}
        ${UI.campo({ rotulo: 'Nome completo / razão social', campo: 'nome_razao', valor: v.nome_razao, col: 'col-md-6', obrig: true })}
        ${UI.campo({ rotulo: 'CPF / CNPJ', campo: 'cpf_cnpj', valor: v.cpf_cnpj, col: 'col-md-4', mascara: 'doc' })}
        ${UI.campo({ rotulo: 'Nome fantasia', campo: 'nome_fantasia', valor: v.nome_fantasia, col: 'col-md-6 so-pj' })}
        ${UI.campo({ rotulo: 'RG / inscrição estadual', campo: 'rg_ie', valor: v.rg_ie, col: 'col-md-3' })}
        ${UI.campo({ rotulo: 'Órgão emissor', campo: 'orgao_emissor', valor: v.orgao_emissor, col: 'col-md-2 so-pf' })}
        ${UI.campo({ rotulo: 'Gênero', campo: 'genero', valor: v.genero, tipo: 'select', col: 'col-md-2 so-pf', opcoes: ['Feminino', 'Masculino'], vazio: '-', ajuda: 'Ajusta o texto dos documentos.' })}
        ${UI.campo({ rotulo: 'Data de nascimento', campo: 'data_nascimento', valor: v.data_nascimento, tipo: 'date', col: 'col-md-3 so-pf' })}
        ${UI.campo({ rotulo: 'Nacionalidade', campo: 'nacionalidade', valor: v.nacionalidade, col: 'col-md-2 so-pf' })}
        ${UI.campo({ rotulo: 'Estado civil', campo: 'estado_civil', valor: v.estado_civil, tipo: 'select', col: 'col-md-2 so-pf', opcoes: App.lista('estado_civil'), vazio: '-' })}
        ${UI.campo({ rotulo: 'Profissão', campo: 'profissao', valor: v.profissao, col: 'col-md-3 so-pf' })}
        ${UI.campo({ rotulo: 'Nome da mãe', campo: 'nome_mae', valor: v.nome_mae, col: 'col-md-4 so-pf', ajuda: 'Usado em requerimentos do INSS.' })}
        ${UI.campo({ rotulo: 'NIT / PIS', campo: 'nit_pis', valor: v.nit_pis, col: 'col-md-3 so-pf' })}
        ${UI.secao('Contato')}
        ${UI.campo({ rotulo: 'Telefone', campo: 'telefone', valor: v.telefone, col: 'col-md-3', mascara: 'telefone' })}
        ${UI.campo({ rotulo: 'WhatsApp', campo: 'whatsapp', valor: v.whatsapp, col: 'col-md-3', mascara: 'telefone' })}
        ${UI.campo({ rotulo: 'E-mail', campo: 'email', valor: v.email, tipo: 'email', col: 'col-md-6' })}
        ${UI.secao('Endereço')}
        ${UI.campo({ rotulo: 'CEP', campo: 'cep', valor: v.cep, col: 'col-md-2', mascara: 'cep', ajuda: 'Preenche o endereço sozinho.' })}
        ${UI.campo({ rotulo: 'Logradouro', campo: 'logradouro', valor: v.logradouro, col: 'col-md-6' })}
        ${UI.campo({ rotulo: 'Número', campo: 'numero', valor: v.numero, col: 'col-md-2' })}
        ${UI.campo({ rotulo: 'Complemento', campo: 'complemento', valor: v.complemento, col: 'col-md-2' })}
        ${UI.campo({ rotulo: 'Bairro / distrito', campo: 'bairro', valor: v.bairro, col: 'col-md-4' })}
        ${UI.campo({ rotulo: 'Cidade', campo: 'cidade', valor: v.cidade, col: 'col-md-4' })}
        ${UI.campo({ rotulo: 'UF', campo: 'uf', valor: v.uf, tipo: 'select', col: 'col-md-2', opcoes: ufs, vazio: '-' })}
        ${UI.secao('Escritório')}
        ${UI.campo({ rotulo: 'Origem', campo: 'origem', valor: v.origem, tipo: 'select', col: 'col-md-3', opcoes: App.lista('origem_cliente'), vazio: '-' })}
        ${UI.campo({ rotulo: 'Unidade', campo: 'id_unidade', valor: v.id_unidade, tipo: 'select', col: 'col-md-3', opcoes: S.unidades, vazio: '-' })}
        ${UI.campo({ rotulo: 'Responsável pelo cadastro', campo: 'id_responsavel', valor: v.id_responsavel, tipo: 'select', col: 'col-md-3', opcoes: S.usuarios, vazio: '-' })}
        ${UI.campo({ rotulo: 'Autorizou o uso dos dados (LGPD)', campo: 'consentimento_lgpd', valor: v.consentimento_lgpd, tipo: 'checkbox', col: 'col-md-3',
          ajuda: v.data_consentimento ? 'Registrado em ' + UI.data(v.data_consentimento) : '' })}
        ${UI.campo({ rotulo: 'Observações', campo: 'obs', valor: v.obs, tipo: 'textarea', col: 'col-12', linhas: 2 })}
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });

    UI.mascaras(m.el);
    const tipo = m.el.querySelector('[data-campo="tipo"]');
    const ajustarTipo = () => {
      const pj = tipo.value === 'PJ';
      m.el.querySelectorAll('.so-pf').forEach(x => x.classList.toggle('d-none', pj));
      m.el.querySelectorAll('.so-pj').forEach(x => x.classList.toggle('d-none', !pj));
    };
    tipo.addEventListener('change', ajustarTipo);
    ajustarTipo();

    const cep = m.el.querySelector('[data-campo="cep"]');
    cep.addEventListener('blur', async () => {
      const d = cep.value.replace(/\D/g, '');
      if (d.length !== 8) return;
      try {
        const r = await (await fetch(`https://viacep.com.br/ws/${d}/json/`)).json();
        if (r.erro) return UI.toast('CEP não encontrado.', 'aviso');
        const set = (k, val) => { const i = m.el.querySelector(`[data-campo="${k}"]`); if (i && val && !i.value) i.value = val; };
        set('logradouro', r.logradouro); set('bairro', r.bairro); set('cidade', r.localidade); set('uf', r.uf);
        m.el.querySelector('[data-campo="numero"]').focus();
      } catch (e) { /* sem internet ou serviço fora: preenche manualmente */ }
    });

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const d = UI.lerForm(m.el);
      if (c) d.id_cliente = c.id_cliente;
      if (!d.nome_razao) return UI.toast('Informe o nome.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try {
          const salvo = await Api.chamar('clientes.salvar', d);
          m.fechar();
          UI.toast(c ? 'Cliente atualizado.' : 'Cliente cadastrado.');
          if (aoSalvar) aoSalvar(salvo);
        } catch (e) { UI.erro(e); }
      });
    };
  },

  async ficha(el, S, id) {
    el.innerHTML = '<div class="vazio"><div class="spinner-border"></div></div>';
    let F;
    try { F = await Api.chamar('clientes.ficha', { id_cliente: id }); }
    catch (e) { el.innerHTML = `<div class="cartao"><div class="vazio"><i class="bi bi-lock"></i>${UI.esc(e.message)}</div></div>`; return; }
    const c = F.cliente;
    const wa = UI.linkWhats(c.whatsapp || c.telefone);
    const info = (rot, val, col = 'col-md-4') => `<div class="${col} campo-info"><div class="rotulo">${rot}</div><div class="valor">${val || '<span class="texto-2">-</span>'}</div></div>`;
    const end = [c.logradouro && `${c.logradouro}${c.numero ? ', ' + c.numero : ''}`, c.complemento, c.bairro, c.cidade && `${c.cidade}${c.uf ? '/' + c.uf : ''}`, c.cep].filter(Boolean).map(UI.esc).join(' · ');

    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div>
          <div class="small"><a href="#/clientes" class="link-limpo texto-2"><i class="bi bi-arrow-left"></i> Clientes</a></div>
          <h1>${UI.esc(c.nome_razao)} ${c.ativo === 'NAO' ? '<span class="chip chip-off">inativo</span>' : ''}</h1>
          <p>${UI.esc(c.id_cliente)} · ${c.tipo === 'PJ' ? 'CNPJ' : 'CPF'} ${UI.esc(c.cpf_cnpj || 'não informado')} · responsável ${UI.esc(App.nomeUsuario(c.id_responsavel))}</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          ${wa ? `<a class="btn btn-outline-success" href="${wa}" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a>` : ''}
          ${App.pode('clientes', 'editar') ? '<button class="btn btn-outline-secondary" data-editar><i class="bi bi-pencil me-1"></i>Editar</button>' : ''}
          ${App.pode('clientes', 'excluir') ? `<button class="btn btn-outline-secondary" data-ativo>${c.ativo === 'NAO' ? 'Reativar' : 'Inativar'}</button>` : ''}
          ${App.pode('casos', 'criar') && c.ativo !== 'NAO' ? '<button class="btn btn-primary" data-novo-caso><i class="bi bi-plus-lg me-1"></i>Novo caso</button>' : ''}
        </div>
      </div>
      <ul class="nav nav-pills mb-3 gap-1">
        <li class="nav-item"><button class="nav-link active" data-aba-btn="dados">Dados</button></li>
        <li class="nav-item"><button class="nav-link" data-aba-btn="casos">Casos (${F.casos.length})</button></li>
        ${App.pode('atendimentos') ? `<li class="nav-item"><button class="nav-link" data-aba-btn="atend">Atendimentos (${F.atendimentos.length})</button></li>` : ''}
        ${App.pode('documentos') ? '<li class="nav-item"><button class="nav-link" data-aba-btn="docs">Documentos</button></li>' : ''}
      </ul>
      <div class="cartao" data-aba-painel="dados"><div class="row g-3">
        ${c.tipo === 'PJ' ? info('Nome fantasia', UI.esc(c.nome_fantasia)) + info('Inscrição estadual', UI.esc(c.rg_ie)) :
          info('Nascimento', c.data_nascimento ? `${UI.data(c.data_nascimento)} <span class="texto-2">(${UI.idade(c.data_nascimento)})</span>` : '') +
          info('RG', UI.esc([c.rg_ie, c.orgao_emissor].filter(Boolean).join(' - '))) + info('Nome da mãe', UI.esc(c.nome_mae)) +
          info('Estado civil · profissão', UI.esc([c.estado_civil, c.profissao].filter(Boolean).join(' · '))) +
          info('Nacionalidade', UI.esc(c.nacionalidade)) + info('NIT / PIS', UI.esc(c.nit_pis))}
        ${info('Telefone', UI.esc(c.telefone))}${info('WhatsApp', UI.esc(c.whatsapp))}${info('E-mail', UI.esc(c.email))}
        ${info('Endereço', end, 'col-12')}
        ${info('Unidade', UI.esc(App.nomeUnidade(c.id_unidade)))}${info('Origem', UI.esc(c.origem))}
        ${info('LGPD', c.consentimento_lgpd === 'SIM' ? `<span class="chip chip-ok">autorizado em ${UI.data(c.data_consentimento)}</span>` : '<span class="chip chip-alerta">sem registro</span>')}
        ${c.obs ? info('Observações', `<span style="white-space:pre-wrap">${UI.esc(c.obs)}</span>`, 'col-12') : ''}
      </div></div>
      <div class="cartao d-none" data-aba-painel="casos">${this.htmlCasos(F.casos)}</div>
      <div class="cartao d-none" data-aba-painel="atend">${this.htmlAtendimentos(F.atendimentos)}</div>
      <div class="cartao d-none" data-aba-painel="docs"><div class="small texto-2 mb-2">Documentos pessoais do cliente e de todos os casos dele que você pode ver.</div><div data-docs-cli></div></div>`;

    let docsCarregados = false;
    UI.abas(el, aba => {
      if (aba === 'docs' && !docsCarregados) { docsCarregados = true; Modulos.documentos.painel(el.querySelector('[data-docs-cli]'), { id_cliente: c.id_cliente }, { mostrarCaso: true, tipoPadrao: 'Documento pessoal' }); }
    });
    const recarregar = () => this.ficha(el, S, id);
    const b1 = el.querySelector('[data-editar]');
    if (b1) b1.onclick = () => this.formulario(c, S, recarregar);
    const b2 = el.querySelector('[data-novo-caso]');
    if (b2) b2.onclick = () => Modulos.casos.formulario(null, S, { id_cliente: c.id_cliente, cliente_nome: c.nome_razao }, caso => { location.hash = '#/casos/' + caso.id_caso; });
    const b3 = el.querySelector('[data-ativo]');
    if (b3) b3.onclick = async () => {
      const ativar = c.ativo === 'NAO';
      if (!await UI.confirmar(ativar ? 'Reativar este cliente?' : 'Inativar este cliente? Ele sai das listas, mas o histórico é mantido.', { perigo: !ativar, botao: ativar ? 'Reativar' : 'Inativar' })) return;
      try { await Api.chamar('clientes.alternarAtivo', { id_cliente: c.id_cliente }); UI.toast('Cliente atualizado.'); recarregar(); } catch (e) { UI.erro(e); }
    };
  },

  htmlCasos(casos) {
    if (!casos.length) return '<div class="vazio"><i class="bi bi-briefcase"></i>Nenhum caso deste cliente que você possa ver.</div>';
    return `<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr>
      <th>Caso</th><th>Área</th><th>Nº</th><th>Responsável</th><th>Status</th></tr></thead><tbody>
      ${casos.map(k => `<tr class="${k.ativo === 'NAO' ? 'linha-inativa' : ''}">
        <td><a class="link-limpo fw-semibold" href="#/casos/${UI.esc(k.id_caso)}">${UI.esc(k.titulo)}</a><div class="small texto-2">${UI.esc(k.id_caso)} · ${UI.esc(k.natureza || '')}</div></td>
        <td>${App.areaHtml(k.id_area)}</td>
        <td class="small">${UI.esc(k.num_cnj || k.nb_beneficio || k.num_protocolo || '-')}</td>
        <td class="small">${UI.esc(App.nomeUsuario(k.id_responsavel))}</td>
        <td>${Modulos.casos.chipStatus(k.status)}</td></tr>`).join('')}
      </tbody></table></div>`;
  },

  htmlAtendimentos(ats) {
    if (!ats.length) return '<div class="vazio"><i class="bi bi-headset"></i>Nenhum atendimento registrado.</div>';
    return ats.sort((a, b) => b.data.localeCompare(a.data)).map(a => `<div class="border-bottom py-2">
      <div class="d-flex justify-content-between"><strong>${UI.esc(a.assunto)}</strong><span class="small texto-2">${UI.data(a.data)}</span></div>
      <div class="small texto-2">${App.areaHtml(a.id_area)} · ${UI.esc(App.nomeUsuario(a.id_responsavel))} · ${UI.esc(a.resultado || 'sem resultado')}
        ${a.id_caso_gerado ? ` · <a href="#/casos/${UI.esc(a.id_caso_gerado)}">${UI.esc(a.id_caso_gerado)}</a>` : ''}</div>
      ${a.relato ? `<div class="small mt-1" style="white-space:pre-wrap">${UI.esc(a.relato)}</div>` : ''}</div>`).join('');
  }
};

</script>
<script>
/* ======== js/modulos/atendimentos.js ======== */
/**
 * Atendimentos — primeiro contato / triagem, com conversão em caso.
 */
Modulos.atendimentos = {
  dados: [],

  async render(el, S) {
    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div><h1>Atendimentos</h1><p>Primeiros contatos e consultas, mesmo os que não viram caso</p></div>
        <div class="d-flex gap-2">
          ${App.pode('atendimentos', 'exportar') ? '<button class="btn btn-outline-secondary" data-exportar><i class="bi bi-download me-1"></i>Exportar</button>' : ''}
          ${App.pode('atendimentos', 'criar') ? '<button class="btn btn-primary" data-novo><i class="bi bi-plus-lg me-1"></i>Novo atendimento</button>' : ''}
        </div>
      </div>
      <div class="cartao" id="ate-tabela"><div class="vazio"><div class="spinner-border"></div></div></div>`;

    const recarregar = () => this.render(el, S);
    const novo = el.querySelector('[data-novo]');
    if (novo) novo.onclick = () => this.formulario(null, S, recarregar);

    try { this.dados = await Api.chamar('atendimentos.listar'); } catch (e) { return UI.erro(e); }
    const hoje = UI.hojeISO();
    this.dados.forEach(a => {
      a._quem = a.cliente_nome || a.nome_contato;
      a._pend = a.data_retorno && !a.id_caso_gerado && a.data_retorno <= hoje && !['Sem viabilidade', 'Cliente desistiu'].includes(a.resultado) ? 'SIM' : 'NAO';
    });
    this.dados.sort((a, b) => (b.data + b.id_atendimento).localeCompare(a.data + a.id_atendimento));

    const exp = el.querySelector('[data-exportar]');
    if (exp) exp.onclick = () => UI.exportarCSV('atendimentos', [
      { titulo: 'ID', campo: 'id_atendimento' }, { titulo: 'Data', campo: 'data' }, { titulo: 'Contato/cliente', campo: '_quem' },
      { titulo: 'Telefone', campo: 'telefone_contato' }, { titulo: 'Área', valor: r => App.nomeArea(r.id_area) }, { titulo: 'Assunto', campo: 'assunto' },
      { titulo: 'Resultado', campo: 'resultado' }, { titulo: 'Retorno', campo: 'data_retorno' }, { titulo: 'Caso gerado', campo: 'id_caso_gerado' },
      { titulo: 'Responsável', valor: r => App.nomeUsuario(r.id_responsavel) }
    ], this.dados);

    const cont = el.querySelector('#ate-tabela');
    UI.tabela(cont, {
      dados: this.dados,
      placeholder: 'Pesquisar por nome, telefone, assunto…',
      busca: ['_quem', 'telefone_contato', 'assunto', 'relato', 'id_atendimento'],
      filtros: [
        { campo: 'resultado', titulo: 'Resultado', opcoes: App.lista('resultado_atendimento').map(v => ({ valor: v, rotulo: v })) },
        { campo: '_pend', titulo: 'Retorno', opcoes: [{ valor: 'SIM', rotulo: 'Retorno vencido/hoje' }] },
        { campo: 'id_area', titulo: 'Área', opcoes: S.areas.map(a => ({ valor: a.id, rotulo: a.nome })) },
        { campo: 'id_responsavel', titulo: 'Responsável', opcoes: S.usuarios.map(u => ({ valor: u.id, rotulo: u.nome })) }
      ],
      colunas: [
        { titulo: 'Data', render: r => `<span class="small">${UI.data(r.data)}</span>` },
        { titulo: 'Quem procurou', render: r => (r.id_cliente ? `<a class="link-limpo fw-semibold" href="#/clientes/${UI.esc(r.id_cliente)}">${UI.esc(r._quem)}</a>` : `<span class="fw-semibold">${UI.esc(r._quem)}</span>`)
            + (r.telefone_contato ? `<div class="small texto-2">${UI.esc(r.telefone_contato)}</div>` : '') },
        { titulo: 'Assunto', render: r => `${UI.esc(r.assunto)}<div class="small texto-2">${App.areaHtml(r.id_area)}</div>` },
        { titulo: 'Resultado', render: r => r.id_caso_gerado ? `<a href="#/casos/${UI.esc(r.id_caso_gerado)}" class="chip chip-ok">Virou caso ${UI.esc(r.id_caso_gerado)}</a>`
            : `<span class="chip">${UI.esc(r.resultado || 'Em aberto')}</span>` },
        { titulo: 'Retorno', render: r => r.data_retorno ? `<span class="small ${r._pend === 'SIM' ? 'text-danger fw-semibold' : ''}">${UI.data(r.data_retorno)}</span>` : '<span class="texto-2">-</span>' },
        { titulo: '', classe: 'text-end', render: r => `<div class="btn-group btn-group-sm">
            ${App.pode('atendimentos', 'editar') ? `<button class="btn btn-outline-secondary" data-acao="editar" data-id="${UI.esc(r.id_atendimento)}" title="Editar"><i class="bi bi-pencil"></i></button>` : ''}
            ${!r.id_caso_gerado && App.pode('casos', 'criar') && App.pode('atendimentos', 'editar') ? `<button class="btn btn-outline-primary" data-acao="converter" data-id="${UI.esc(r.id_atendimento)}"><i class="bi bi-arrow-right-circle me-1"></i>Virar caso</button>` : ''}
          </div>` }
      ]
    });

    cont.addEventListener('click', e => {
      const b = e.target.closest('[data-acao]');
      if (!b) return;
      const a = this.dados.find(x => x.id_atendimento === b.dataset.id);
      if (b.dataset.acao === 'editar') this.formulario(a, S, recarregar);
      if (b.dataset.acao === 'converter') this.converter(a, S);
    });
  },

  async formulario(a, S, aoSalvar) {
    const v = a || { data: UI.hojeISO(), id_responsavel: S.usuario.id_usuario, id_unidade: S.usuario.id_unidade };
    let clientes = [];
    if (App.pode('clientes')) { try { clientes = (await Modulos.clientes.carregarLista()).filter(c => c.ativo !== 'NAO'); } catch (e) { /* segue sem lista */ } }
    const cliAtual = v.id_cliente ? clientes.find(c => c.id_cliente === v.id_cliente) : null;

    const m = UI.modal({
      titulo: a ? 'Editar atendimento' : 'Novo atendimento',
      tamanho: 'modal-lg',
      corpo: `<form class="row g-3" novalidate>
        ${UI.campo({ rotulo: 'Data', campo: 'data', valor: v.data, tipo: 'date', col: 'col-md-3' })}
        ${UI.campo({ rotulo: 'Já é cliente? (opcional)', campo: '_cliente', valor: cliAtual ? Modulos.clientes.opcaoDatalist(cliAtual) : '', col: 'col-md-9',
          lista: clientes.map(c => Modulos.clientes.opcaoDatalist(c)), attrs: 'placeholder="Digite o nome ou CPF e escolha na lista"' })}
        ${UI.campo({ rotulo: 'Nome de quem procurou', campo: 'nome_contato', valor: v.nome_contato, col: 'col-md-7', ajuda: 'Obrigatório se não for cliente cadastrado.' })}
        ${UI.campo({ rotulo: 'Telefone', campo: 'telefone_contato', valor: v.telefone_contato, col: 'col-md-5', mascara: 'telefone' })}
        ${UI.campo({ rotulo: 'Assunto', campo: 'assunto', valor: v.assunto, col: 'col-md-7', obrig: true, attrs: 'placeholder="Ex.: aposentadoria rural da mãe"' })}
        ${UI.campo({ rotulo: 'Área', campo: 'id_area', valor: v.id_area, tipo: 'select', col: 'col-md-5', opcoes: S.areas })}
        ${UI.campo({ rotulo: 'Relato', campo: 'relato', valor: v.relato, tipo: 'textarea', col: 'col-12', linhas: 4 })}
        ${UI.campo({ rotulo: 'Resultado', campo: 'resultado', valor: v.resultado, tipo: 'select', col: 'col-md-4', opcoes: App.lista('resultado_atendimento'), vazio: 'Em aberto' })}
        ${UI.campo({ rotulo: 'Data de retorno', campo: 'data_retorno', valor: v.data_retorno, tipo: 'date', col: 'col-md-4' })}
        ${UI.campo({ rotulo: 'Responsável', campo: 'id_responsavel', valor: v.id_responsavel, tipo: 'select', col: 'col-md-4', opcoes: S.usuarios })}
        ${UI.campo({ rotulo: 'Unidade', campo: 'id_unidade', valor: v.id_unidade, tipo: 'select', col: 'col-md-4', opcoes: S.unidades, vazio: '-' })}
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });
    UI.mascaras(m.el);

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const d = UI.lerForm(m.el);
      d.id_cliente = Modulos.clientes.idDoDatalist(d._cliente);
      delete d._cliente;
      if (a) d.id_atendimento = a.id_atendimento;
      if (!d.id_cliente && !d.nome_contato) return UI.toast('Informe o nome ou escolha um cliente.', 'aviso');
      if (!d.assunto) return UI.toast('Informe o assunto.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try { await Api.chamar('atendimentos.salvar', d); m.fechar(); UI.toast('Atendimento salvo.'); if (aoSalvar) aoSalvar(); }
        catch (e) { UI.erro(e); }
      });
    };
  },

  converter(a, S) {
    const precisaCliente = !a.id_cliente;
    const m = UI.modal({
      titulo: 'Converter atendimento em caso',
      tamanho: 'modal-lg',
      corpo: `<form class="row g-3" novalidate>
        ${precisaCliente ? `${UI.secao('Cadastrar cliente')}
          ${UI.campo({ rotulo: 'Tipo', campo: 'c_tipo', tipo: 'select', col: 'col-md-3', opcoes: [{ id: 'PF', nome: 'Pessoa física' }, { id: 'PJ', nome: 'Pessoa jurídica' }], vazio: null })}
          ${UI.campo({ rotulo: 'Nome completo', campo: 'c_nome_razao', valor: a.nome_contato, col: 'col-md-9', obrig: true })}
          ${UI.campo({ rotulo: 'CPF / CNPJ', campo: 'c_cpf_cnpj', col: 'col-md-6', mascara: 'doc' })}
          ${UI.campo({ rotulo: 'Telefone', campo: 'c_telefone', valor: a.telefone_contato, col: 'col-md-6', mascara: 'telefone' })}
          <div class="col-12 form-text mt-0">Os demais dados podem ser completados depois, na ficha do cliente.</div>`
        : `<div class="col-12"><div class="alert alert-secondary small mb-0">Cliente: <strong>${UI.esc(a.cliente_nome)}</strong></div></div>`}
        ${UI.secao('Caso')}
        ${UI.campo({ rotulo: 'Área', campo: 'id_area', valor: a.id_area, tipo: 'select', col: 'col-md-4', opcoes: S.areas, obrig: true })}
        ${UI.campo({ rotulo: 'Natureza', campo: 'natureza', valor: /inss|previd/i.test(App.nomeArea(a.id_area)) ? 'Administrativo' : 'Judicial', tipo: 'select', col: 'col-md-4', opcoes: App.lista('natureza_caso'), vazio: null })}
        ${UI.campo({ rotulo: 'Responsável', campo: 'id_responsavel', valor: a.id_responsavel, tipo: 'select', col: 'col-md-4', opcoes: S.usuarios })}
        ${UI.campo({ rotulo: 'Tipo de ação / benefício', campo: 'tipo_acao', col: 'col-md-6', lista: App.lista('tipo_acao'), obrig: true })}
        ${UI.campo({ rotulo: 'Título do caso', campo: 'titulo', valor: a.assunto, col: 'col-md-6' })}
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Criar caso</button>`
    });
    UI.mascaras(m.el);

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const f = UI.lerForm(m.el);
      const caso = { id_area: f.id_area, natureza: f.natureza, id_responsavel: f.id_responsavel, tipo_acao: f.tipo_acao, titulo: f.titulo, id_unidade: a.id_unidade };
      const d = { id_atendimento: a.id_atendimento, caso };
      if (precisaCliente) {
        if (!f.c_nome_razao) return UI.toast('Informe o nome do cliente.', 'aviso');
        d.cliente = { tipo: f.c_tipo, nome_razao: f.c_nome_razao, cpf_cnpj: f.c_cpf_cnpj, telefone: f.c_telefone, id_unidade: a.id_unidade };
      }
      if (!caso.id_area || (!caso.tipo_acao && !caso.titulo)) return UI.toast('Informe a área e o tipo de ação.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try {
          const k = await Api.chamar('atendimentos.converter', d);
          m.fechar();
          UI.toast('Caso criado.');
          location.hash = '#/casos/' + k.id_caso;
        } catch (e) { UI.erro(e); }
      });
    };
  }
};

</script>
<script>
/* ======== js/modulos/casos.js ======== */
/**
 * Casos e processos — lista, cadastro (judicial / administrativo INSS) e ficha com andamentos.
 * Rotas: #/casos  e  #/casos/CAS-000001
 */
Modulos.casos = {
  dados: [],
  sugestoes: {},

  render(el, S, param) {
    return param ? this.ficha(el, S, param) : this.lista(el, S);
  },

  chipStatus(s) {
    const t = String(s || '').toLowerCase();
    const cls = t.indexOf('encerrado - êxito') === 0 ? 'chip-ok' : t.indexOf('encerrado') === 0 || t === 'arquivado' ? 'chip-off'
      : t.indexOf('aguardando') === 0 || t === 'suspenso' ? 'chip-alerta' : '';
    return `<span class="chip ${cls}">${UI.esc(s || '-')}</span>`;
  },

  numero(k) { return k.num_cnj || (k.nb_beneficio ? 'NB ' + k.nb_beneficio : '') || (k.num_protocolo ? 'Prot. ' + k.num_protocolo : ''); },

  async lista(el, S) {
    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div><h1>Casos e processos</h1><p>Judiciais, administrativos (INSS) e consultivos</p></div>
        <div class="d-flex gap-2">
          ${App.pode('casos', 'exportar') ? '<button class="btn btn-outline-secondary" data-exportar><i class="bi bi-download me-1"></i>Exportar</button>' : ''}
          ${App.pode('casos', 'criar') ? '<button class="btn btn-primary" data-novo><i class="bi bi-plus-lg me-1"></i>Novo caso</button>' : ''}
        </div>
      </div>
      <div class="cartao" id="cas-tabela"><div class="vazio"><div class="spinner-border"></div></div></div>`;

    const novo = el.querySelector('[data-novo]');
    if (novo) novo.onclick = () => this.formulario(null, S, {}, k => { location.hash = '#/casos/' + k.id_caso; });

    try {
      const r = await Api.chamar('casos.listar');
      this.dados = r.casos; this.sugestoes = r.sugestoes;
    } catch (e) { return UI.erro(e); }

    const exp = el.querySelector('[data-exportar]');
    if (exp) exp.onclick = () => UI.exportarCSV('casos', [
      { titulo: 'ID', campo: 'id_caso' }, { titulo: 'Título', campo: 'titulo' }, { titulo: 'Cliente', campo: 'cliente_nome' },
      { titulo: 'CPF/CNPJ', campo: 'cliente_doc' }, { titulo: 'Área', valor: r => App.nomeArea(r.id_area) }, { titulo: 'Natureza', campo: 'natureza' },
      { titulo: 'Tipo de ação', campo: 'tipo_acao' }, { titulo: 'Nº CNJ', campo: 'num_cnj' }, { titulo: 'Protocolo', campo: 'num_protocolo' },
      { titulo: 'NB', campo: 'nb_beneficio' }, { titulo: 'Parte contrária', campo: 'parte_contraria' }, { titulo: 'Fase', campo: 'fase' },
      { titulo: 'Status', campo: 'status' }, { titulo: 'Responsável', valor: r => App.nomeUsuario(r.id_responsavel) },
      { titulo: 'Apoio', valor: r => r.id_apoio ? App.nomeUsuario(r.id_apoio) : '' }, { titulo: 'Abertura', campo: 'data_abertura' },
      { titulo: 'Encerramento', campo: 'data_encerramento' }
    ], this.dados);

    UI.tabela(el.querySelector('#cas-tabela'), {
      dados: this.dados,
      placeholder: 'Pesquisar por título, cliente, CPF, nº CNJ, NB, protocolo, parte contrária…',
      busca: ['titulo', 'cliente_nome', 'cliente_doc', 'num_cnj', 'nb_beneficio', 'num_protocolo', 'parte_contraria', 'tipo_acao', 'id_caso'],
      filtros: [
        { campo: 'situacao', titulo: 'Situação', opcoes: [{ valor: 'ATIVO', rotulo: 'Ativos' }, { valor: 'ENCERRADO', rotulo: 'Encerrados' }] },
        { campo: 'id_area', titulo: 'Área', opcoes: S.areas.map(a => ({ valor: a.id, rotulo: a.nome })) },
        { campo: 'status', titulo: 'Status', opcoes: App.lista('status_caso').map(v => ({ valor: v, rotulo: v })) },
        { campo: 'id_responsavel', titulo: 'Responsável', opcoes: S.usuarios.map(u => ({ valor: u.id, rotulo: u.nome })) },
        { campo: 'id_unidade', titulo: 'Unidade', opcoes: S.unidades.map(u => ({ valor: u.id, rotulo: u.nome })) }
      ],
      linhaClasse: r => r.ativo === 'NAO' ? 'linha-inativa' : '',
      colunas: [
        { titulo: 'Caso', render: r => `<a class="link-limpo fw-semibold" href="#/casos/${UI.esc(r.id_caso)}">${UI.esc(r.titulo)}</a>
            <div class="small texto-2">${UI.esc(r.id_caso)} · ${UI.esc(r.natureza || '-')}</div>` },
        { titulo: 'Cliente', render: r => `<a class="link-limpo" href="#/clientes/${UI.esc(r.id_cliente)}">${UI.esc(r.cliente_nome)}</a>` },
        { titulo: 'Área', render: r => `<span class="small">${App.areaHtml(r.id_area)}</span>` },
        { titulo: 'Nº / referência', render: r => `<span class="small">${UI.esc(this.numero(r) || '-')}</span>` },
        { titulo: 'Responsável', render: r => `<span class="small">${UI.esc(App.nomeUsuario(r.id_responsavel))}</span>` },
        { titulo: 'Status', render: r => this.chipStatus(r.status) }
      ]
    });
  },

  /**
   * Formulário do caso. preset: { id_cliente, cliente_nome, id_area, ... } para novos casos.
   */
  async formulario(k, S, preset, aoSalvar) {
    preset = preset || {};
    const v = Object.assign({ id_responsavel: S.usuario.id_usuario, id_unidade: S.usuario.id_unidade, natureza: 'Judicial' }, preset, k || {});
    if (!this.sugestoes.parte_contraria) {
      try { const r = await Api.chamar('casos.listar'); this.dados = r.casos; this.sugestoes = r.sugestoes; } catch (e) { /* segue sem sugestões */ }
    }
    let clientes = [];
    const clienteFixo = !!(k || preset.id_cliente);
    if (!clienteFixo) {
      try { clientes = (await Modulos.clientes.carregarLista()).filter(c => c.ativo !== 'NAO'); } catch (e) { return UI.erro(e); }
    }
    const nomeCli = k ? (k.cliente_nome || k.id_cliente) : preset.cliente_nome;
    const sug = this.sugestoes || {};

    const m = UI.modal({
      titulo: k ? 'Editar caso' : 'Novo caso',
      tamanho: 'modal-xl',
      corpo: `<form class="row g-3" novalidate>
        ${UI.secao('Cliente e classificação')}
        ${clienteFixo ? `<div class="col-md-6"><label class="form-label">Cliente</label><input class="form-control" value="${UI.esc(nomeCli)}" disabled></div>`
          : UI.campo({ rotulo: 'Cliente', campo: '_cliente', col: 'col-md-6', obrig: true, lista: clientes.map(c => Modulos.clientes.opcaoDatalist(c)),
              attrs: 'placeholder="Digite o nome ou CPF e escolha na lista"', ajuda: 'Não achou? Cadastre primeiro em Clientes.' })}
        ${UI.campo({ rotulo: 'Área de atuação', campo: 'id_area', valor: v.id_area, tipo: 'select', col: 'col-md-3', opcoes: S.areas, obrig: true })}
        ${UI.campo({ rotulo: 'Natureza', campo: 'natureza', valor: v.natureza, tipo: 'select', col: 'col-md-3', opcoes: App.lista('natureza_caso'), vazio: null })}
        ${UI.campo({ rotulo: 'Tipo de ação / benefício', campo: 'tipo_acao', valor: v.tipo_acao, col: 'col-md-4', lista: App.lista('tipo_acao'), obrig: true })}
        ${UI.campo({ rotulo: 'Título do caso', campo: 'titulo', valor: v.titulo, col: 'col-md-5', ajuda: 'Se ficar vazio, usa o tipo de ação.' })}
        ${UI.campo({ rotulo: 'Polo do cliente', campo: 'polo', valor: v.polo, tipo: 'select', col: 'col-md-3', opcoes: ['Autor / requerente', 'Réu / requerido', 'Terceiro interessado'], vazio: '-' })}
        ${UI.campo({ rotulo: 'Parte contrária', campo: 'parte_contraria', valor: v.parte_contraria, col: 'col-md-6', lista: ['INSS'].concat(sug.parte_contraria || []).filter((x, i, a) => a.indexOf(x) === i) })}
        ${UI.campo({ rotulo: 'Valor da causa', campo: 'valor_causa', valor: v.valor_causa, col: 'col-md-3', attrs: 'placeholder="R$ 0,00"' })}
        ${UI.campo({ rotulo: 'Data de abertura', campo: 'data_abertura', valor: v.data_abertura || UI.hojeISO(), tipo: 'date', col: 'col-md-3' })}

        <div class="col-12 bloco-judicial"><div class="row g-3">
          ${UI.secao('Processo judicial')}
          ${UI.campo({ rotulo: 'Número CNJ', campo: 'num_cnj', valor: v.num_cnj, col: 'col-md-4', mascara: 'cnj', attrs: 'placeholder="0000000-00.0000.0.00.0000"' })}
          ${UI.campo({ rotulo: 'Vara / órgão julgador', campo: 'orgao_vara', valor: v.orgao_vara, col: 'col-md-5', lista: sug.orgao_vara || [] })}
          ${UI.campo({ rotulo: 'Comarca', campo: 'comarca', valor: v.comarca, col: 'col-md-3', lista: sug.comarca || [] })}
        </div></div>

        <div class="col-12 bloco-adm"><div class="row g-3">
          ${UI.secao('Requerimento administrativo (INSS)')}
          ${UI.campo({ rotulo: 'Nº do protocolo', campo: 'num_protocolo', valor: v.num_protocolo, col: 'col-md-3' })}
          ${UI.campo({ rotulo: 'NB (nº do benefício)', campo: 'nb_beneficio', valor: v.nb_beneficio, col: 'col-md-3' })}
          ${UI.campo({ rotulo: 'Espécie do benefício', campo: 'especie_beneficio', valor: v.especie_beneficio, col: 'col-md-6', lista: sug.especie_beneficio || [], attrs: 'placeholder="Ex.: B41 - Aposentadoria por idade"' })}
          ${UI.campo({ rotulo: 'DER (entrada do requerimento)', campo: 'der', valor: v.der, tipo: 'date', col: 'col-md-3' })}
          ${UI.campo({ rotulo: 'DIB (início do benefício)', campo: 'dib', valor: v.dib, tipo: 'date', col: 'col-md-3' })}
        </div></div>

        ${UI.secao('Equipe e andamento')}
        ${UI.campo({ rotulo: 'Responsável', campo: 'id_responsavel', valor: v.id_responsavel, tipo: 'select', col: 'col-md-3', opcoes: S.usuarios, obrig: true })}
        ${UI.campo({ rotulo: 'Apoio', campo: 'id_apoio', valor: v.id_apoio, tipo: 'select', col: 'col-md-3', opcoes: S.usuarios, vazio: 'Nenhum' })}
        ${UI.campo({ rotulo: 'Unidade', campo: 'id_unidade', valor: v.id_unidade, tipo: 'select', col: 'col-md-2', opcoes: S.unidades, vazio: '-' })}
        ${UI.campo({ rotulo: 'Fase', campo: 'fase', valor: v.fase, tipo: 'select', col: 'col-md-2', opcoes: App.lista('fase_caso'), vazio: '-' })}
        ${UI.campo({ rotulo: 'Status', campo: 'status', valor: v.status || 'Em análise', tipo: 'select', col: 'col-md-2', opcoes: App.lista('status_caso'), vazio: null })}
        ${k ? UI.campo({ rotulo: 'Resultado / desfecho', campo: 'resultado', valor: v.resultado, col: 'col-md-12', ajuda: 'Preencha ao encerrar o caso.' }) : ''}
        ${UI.campo({ rotulo: 'Observações', campo: 'obs', valor: v.obs, tipo: 'textarea', col: 'col-12', linhas: 2 })}
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });

    UI.mascaras(m.el);
    const nat = m.el.querySelector('[data-campo="natureza"]');
    const ajustar = () => {
      const n = (nat.value || '').toLowerCase();
      m.el.querySelector('.bloco-judicial').classList.toggle('d-none', n.indexOf('admin') === 0);
      m.el.querySelector('.bloco-adm').classList.toggle('d-none', n === 'judicial');
    };
    nat.addEventListener('change', ajustar);
    ajustar();

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const d = UI.lerForm(m.el);
      if (k) d.id_caso = k.id_caso;
      d.id_cliente = clienteFixo ? (k ? k.id_cliente : preset.id_cliente) : Modulos.clientes.idDoDatalist(d._cliente);
      delete d._cliente;
      if (!d.id_cliente) return UI.toast('Escolha o cliente na lista de sugestões.', 'aviso');
      if (!d.id_area) return UI.toast('Escolha a área de atuação.', 'aviso');
      if (!d.tipo_acao && !d.titulo) return UI.toast('Informe o tipo de ação ou um título.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try {
          const salvo = await Api.chamar('casos.salvar', d);
          this.sugestoes = {};
          m.fechar();
          UI.toast(k ? 'Caso atualizado.' : 'Caso cadastrado.');
          if (aoSalvar) aoSalvar(salvo);
        } catch (e) { UI.erro(e); }
      });
    };
  },

  async ficha(el, S, id) {
    el.innerHTML = '<div class="vazio"><div class="spinner-border"></div></div>';
    let F;
    try { F = await Api.chamar('casos.ficha', { id_caso: id }); }
    catch (e) { el.innerHTML = `<div class="cartao"><div class="vazio"><i class="bi bi-lock"></i>${UI.esc(e.message)}</div></div>`; return; }
    const k = F.caso, c = F.cliente || {};
    k.cliente_nome = c.nome_razao;
    const info = (rot, val) => val ? `<div class="campo-info mb-2"><div class="rotulo">${rot}</div><div class="valor">${val}</div></div>` : '';
    const adm = (k.natureza || '').toLowerCase().indexOf('admin') === 0;
    const podeAnd = App.pode('casos', 'editar') || App.pode('casos', 'criar');

    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div>
          <div class="small"><a href="#/casos" class="link-limpo texto-2"><i class="bi bi-arrow-left"></i> Casos</a></div>
          <h1>${UI.esc(k.titulo)} ${k.ativo === 'NAO' ? '<span class="chip chip-off">inativo</span>' : ''}</h1>
          <p>${UI.esc(k.id_caso)} · <a href="#/clientes/${UI.esc(k.id_cliente)}" class="link-limpo">${UI.esc(c.nome_razao || k.id_cliente)}</a> · ${App.areaHtml(k.id_area)}</p>
        </div>
        <div class="d-flex gap-2 align-items-center flex-wrap">
          ${this.chipStatus(k.status)} ${k.fase ? `<span class="chip">${UI.esc(k.fase)}</span>` : ''}
          ${App.pode('casos', 'editar') ? '<button class="btn btn-outline-secondary" data-editar><i class="bi bi-pencil me-1"></i>Editar</button>' : ''}
          ${App.pode('casos', 'excluir') ? `<button class="btn btn-outline-secondary" data-ativo>${k.ativo === 'NAO' ? 'Reativar' : 'Inativar'}</button>` : ''}
        </div>
      </div>
      <div class="row g-3">
        <div class="col-lg-5"><div class="cartao h-100">
          <h2 class="h6 mb-3">Dados do caso</h2>
          ${info('Natureza · tipo', UI.esc([k.natureza, k.tipo_acao].filter(Boolean).join(' · ')))}
          ${adm ? info('Protocolo · NB', UI.esc([k.num_protocolo, k.nb_beneficio].filter(Boolean).join(' · '))) +
                  info('Espécie', UI.esc(k.especie_beneficio)) +
                  info('DER · DIB', [k.der && 'DER ' + UI.data(k.der), k.dib && 'DIB ' + UI.data(k.dib)].filter(Boolean).join(' · '))
                : info('Número CNJ', UI.esc(k.num_cnj)) + info('Vara · comarca', UI.esc([k.orgao_vara, k.comarca].filter(Boolean).join(' · ')))}
          ${info('Polo do cliente', UI.esc(k.polo))}
          ${info('Parte contrária', UI.esc(k.parte_contraria))}
          ${info('Valor da causa', UI.esc(k.valor_causa))}
          ${info('Responsável · apoio', UI.esc([App.nomeUsuario(k.id_responsavel), k.id_apoio && App.nomeUsuario(k.id_apoio)].filter(Boolean).join(' · ')))}
          ${info('Unidade', UI.esc(App.nomeUnidade(k.id_unidade)))}
          ${info('Abertura · encerramento', [UI.data(k.data_abertura), k.data_encerramento && UI.data(k.data_encerramento)].filter(Boolean).join(' → '))}
          ${info('Resultado', UI.esc(k.resultado))}
          ${k.obs ? info('Observações', `<span style="white-space:pre-wrap">${UI.esc(k.obs)}</span>`) : ''}
          <hr><div class="small texto-2">Cliente: ${[c.cpf_cnpj, c.whatsapp || c.telefone].filter(Boolean).map(UI.esc).join(' · ') || 'sem documento/contato'}
            ${UI.linkWhats(c.whatsapp || c.telefone) ? ` <a href="${UI.linkWhats(c.whatsapp || c.telefone)}" target="_blank" rel="noopener"><i class="bi bi-whatsapp text-success"></i></a>` : ''}</div>
        </div></div>
        <div class="col-lg-7"><div class="cartao h-100">
          <h2 class="h6 mb-3">Andamentos</h2>
          ${podeAnd && k.ativo !== 'NAO' ? `<div class="row g-2 mb-3" id="novo-and">
            ${UI.campo({ rotulo: 'Data', campo: 'data', valor: UI.hojeISO(), tipo: 'date', col: 'col-md-4' })}
            ${UI.campo({ rotulo: 'Tipo', campo: 'tipo', tipo: 'select', col: 'col-md-8', opcoes: App.lista('tipo_andamento'), vazio: null })}
            ${UI.campo({ rotulo: 'Descrição', campo: 'descricao', tipo: 'textarea', col: 'col-12', linhas: 2, attrs: 'placeholder="O que aconteceu? Ex.: exigência do INSS, audiência marcada, contato com o cliente…"' })}
            <div class="col-12 text-end"><button class="btn btn-primary btn-sm" data-add-and><i class="bi bi-plus-lg me-1"></i>Registrar andamento</button></div>
          </div>` : ''}
          <div class="linha-tempo">${F.andamentos.length ? F.andamentos.map(a => `<div class="item">
              <div class="meta">${UI.data(a.data)} · ${UI.esc(App.nomeUsuario(a.criado_por) === 'SISTEMA' ? 'Sistema' : App.nomeUsuario(a.criado_por))} · ${UI.esc(a.tipo)}
                ${App.pode('casos', 'excluir') ? `<button class="btn btn-link btn-sm p-0 ms-2 texto-2" data-rem="${UI.esc(a.id_andamento)}" title="Remover"><i class="bi bi-x-circle"></i></button>` : ''}</div>
              <div class="texto">${UI.esc(a.descricao)}</div></div>`).join('')
            : '<div class="texto-2 small">Nenhum andamento registrado.</div>'}</div>
        </div></div>
        ${App.pode('contratos') ? `<div class="col-lg-5"><div class="cartao h-100">
          <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h6 mb-0">Contratos</h2>
            ${App.pode('contratos', 'criar') && k.ativo !== 'NAO' ? '<button class="btn btn-sm btn-primary" data-novo-contrato><i class="bi bi-plus-lg me-1"></i>Novo contrato</button>' : ''}</div>
          <div data-contratos><div class="texto-2 small">Carregando…</div></div>
        </div></div>` : ''}
        ${App.pode('documentos') ? `<div class="${App.pode('contratos') ? 'col-lg-7' : 'col-12'}"><div class="cartao h-100">
          <h2 class="h6 mb-2">Documentos do caso</h2><div data-docs-caso></div>
        </div></div>` : ''}
      </div>`;

    const recarregar = () => this.ficha(el, S, id);
    const boxCtr = el.querySelector('[data-contratos]');
    if (boxCtr) {
      Api.chamar('contratos.listar', { id_caso: k.id_caso }).then(lista => {
        boxCtr.innerHTML = lista.length ? lista.map(c => `<div class="d-flex justify-content-between align-items-center py-2 border-top">
            <div><a class="link-limpo fw-semibold" href="#/contratos/${UI.esc(c.id_contrato)}">${UI.esc(c.id_contrato)}</a>
            <div class="small texto-2">${UI.data(c.data_contrato)} · ${UI.esc(Modulos.contratos.resumoHonorarios(c))}</div></div>${Modulos.contratos.chip(c.status)}</div>`).join('')
          : '<div class="texto-2 small">Nenhum contrato para este caso.</div>';
      }).catch(e => { boxCtr.innerHTML = `<div class="small text-danger">${UI.esc(e.message)}</div>`; });
    }
    const bnc = el.querySelector('[data-novo-contrato]');
    if (bnc) bnc.onclick = () => Modulos.contratos.formulario(null, S, { caso: Object.assign({}, k, { cliente_nome: c.nome_razao }) }, ctr => { location.hash = '#/contratos/' + ctr.id_contrato; });
    const boxDoc = el.querySelector('[data-docs-caso]');
    if (boxDoc) Modulos.documentos.painel(boxDoc, { id_caso: k.id_caso });
    const be = el.querySelector('[data-editar]');
    if (be) be.onclick = () => this.formulario(k, S, {}, recarregar);
    const ba = el.querySelector('[data-ativo]');
    if (ba) ba.onclick = async () => {
      const ativar = k.ativo === 'NAO';
      if (!await UI.confirmar(ativar ? 'Reativar este caso?' : 'Inativar este caso? Use só para cadastro feito por engano; para casos concluídos, mude o status para "Encerrado".', { perigo: !ativar, botao: ativar ? 'Reativar' : 'Inativar' })) return;
      try { await Api.chamar('casos.alternarAtivo', { id_caso: k.id_caso }); UI.toast('Caso atualizado.'); recarregar(); } catch (e) { UI.erro(e); }
    };
    const bAdd = el.querySelector('[data-add-and]');
    if (bAdd) bAdd.onclick = async () => {
      const d = UI.lerForm(el.querySelector('#novo-and'));
      if (!d.descricao) return UI.toast('Escreva a descrição do andamento.', 'aviso');
      d.id_caso = k.id_caso;
      await UI.ocupado(bAdd, async () => {
        try { await Api.chamar('casos.adicionarAndamento', d); UI.toast('Andamento registrado.'); recarregar(); } catch (e) { UI.erro(e); }
      });
    };
    el.querySelectorAll('[data-rem]').forEach(b => b.onclick = async () => {
      if (!await UI.confirmar('Remover este andamento? Ele continua registrado na auditoria.', { perigo: true, botao: 'Remover' })) return;
      try { await Api.chamar('casos.removerAndamento', { id_andamento: b.dataset.rem }); recarregar(); } catch (e) { UI.erro(e); }
    });
  }
};

</script>
<script>
/* ======== js/modulos/usuarios.js ======== */
/**
 * Usuários — cadastro de advogados e equipe, cargo, unidade, OAB e áreas de atuação.
 */
Modulos.usuarios = {
  dados: [],

  async render(el, S) {
    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div><h1>Usuários</h1><p>Advogados e equipe com acesso ao sistema</p></div>
        ${App.pode('usuarios', 'criar') ? '<button class="btn btn-primary" data-novo><i class="bi bi-plus-lg me-1"></i>Novo usuário</button>' : ''}
      </div>
      <div class="cartao" id="usu-tabela"><div class="vazio"><div class="spinner-border"></div></div></div>`;

    const btnNovo = el.querySelector('[data-novo]');
    if (btnNovo) btnNovo.onclick = () => this.formulario(null, S);

    await this.carregar(S);

    el.querySelector('#usu-tabela').addEventListener('click', e => {
      const b = e.target.closest('[data-acao]');
      if (!b) return;
      const u = this.dados.find(x => x.id_usuario === b.dataset.id);
      if (b.dataset.acao === 'editar') this.formulario(u, S);
      if (b.dataset.acao === 'senha') this.redefinirSenha(u);
      if (b.dataset.acao === 'ativo') this.alternarAtivo(u, S);
    });
  },

  async carregar(S) {
    try {
      this.dados = await Api.chamar('usuarios.listar');
    } catch (e) { UI.erro(e); return; }

    const areasNome = Object.fromEntries(S.areas.map(a => [a.id, a.nome]));
    const unidNome = Object.fromEntries(S.unidades.map(u => [u.id, u.nome]));
    this.dados.forEach(u => {
      u._areas = u.areas.map(a => areasNome[a]).filter(Boolean).join(', ');
      u._unidade = unidNome[u.id_unidade] || '-';
    });

    const podeEditar = App.pode('usuarios', 'editar');
    const podeExcluir = App.pode('usuarios', 'excluir');

    UI.tabela(document.getElementById('usu-tabela'), {
      dados: this.dados,
      placeholder: 'Pesquisar por nome, e-mail, OAB, CPF…',
      busca: ['nome', 'email', 'oab_numero', 'cpf', 'cargo_nome', '_areas'],
      filtros: [
        { campo: 'id_cargo', titulo: 'Cargo', opcoes: S.cargos.map(c => ({ valor: c.id, rotulo: c.nome })) },
        { campo: 'ativo', titulo: 'Situação', opcoes: [{ valor: 'SIM', rotulo: 'Ativos' }, { valor: 'NAO', rotulo: 'Inativos' }] }
      ],
      linhaClasse: r => r.ativo === 'NAO' ? 'linha-inativa' : '',
      colunas: [
        { titulo: 'Usuário', render: r => `<div class="fw-semibold">${UI.esc(r.nome)}</div><div class="small texto-2">${UI.esc(r.email)}</div>` },
        { titulo: 'Cargo', render: r => `${UI.esc(r.cargo_nome)}${r.cargo_master === 'SIM' ? ' <span class="chip chip-alerta">master</span>' : ''}` },
        { titulo: 'OAB', render: r => r.oab_numero ? UI.esc(`${r.oab_uf || ''} ${r.oab_numero}`) : '<span class="texto-2">-</span>' },
        { titulo: 'Áreas', render: r => r._areas ? `<span class="small">${UI.esc(r._areas)}</span>` : '<span class="texto-2 small">nenhuma</span>' },
        { titulo: 'Unidade', campo: '_unidade' },
        { titulo: 'Situação', render: r => r.ativo === 'NAO' ? '<span class="chip chip-off">Inativo</span>'
            : r.bloqueado === 'SIM' ? '<span class="chip chip-alerta">Bloqueado</span>'
            : r.primeiro_acesso === 'SIM' ? '<span class="chip chip-alerta">Aguardando 1º acesso</span>' : '<span class="chip chip-ok">Ativo</span>' },
        { titulo: 'Último acesso', render: r => `<span class="small">${UI.dataHora(r.ultimo_login)}</span>` },
        { titulo: '', classe: 'text-end', render: r => `<div class="btn-group btn-group-sm">
            ${podeEditar ? `<button class="btn btn-outline-secondary" data-acao="editar" data-id="${UI.esc(r.id_usuario)}" title="Editar"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-secondary" data-acao="senha" data-id="${UI.esc(r.id_usuario)}" title="Redefinir senha"><i class="bi bi-key"></i></button>` : ''}
            ${podeExcluir && r.id_usuario !== App.S.usuario.id_usuario ? `<button class="btn btn-outline-secondary" data-acao="ativo" data-id="${UI.esc(r.id_usuario)}" title="${r.ativo === 'NAO' ? 'Reativar' : 'Inativar'}"><i class="bi ${r.ativo === 'NAO' ? 'bi-arrow-counterclockwise' : 'bi-slash-circle'}"></i></button>` : ''}
          </div>` }
      ]
    });
  },

  formulario(u, S) {
    const v = u || {};
    const ehEu = u && u.id_usuario === S.usuario.id_usuario;
    const cargos = S.cargos.filter(c => c.master !== 'SIM' || S.master);
    const ufs = 'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
    const m = UI.modal({
      titulo: u ? 'Editar usuário' : 'Novo usuário',
      tamanho: 'modal-lg',
      corpo: `<form class="row g-3" novalidate>
        <div class="col-md-7"><label class="form-label">Nome completo *</label><input class="form-control" data-campo="nome" value="${UI.esc(v.nome)}"></div>
        <div class="col-md-5"><label class="form-label">E-mail (login) *</label><input type="email" class="form-control" data-campo="email" value="${UI.esc(v.email)}"></div>
        <div class="col-md-6"><label class="form-label">Cargo *</label>
          <select class="form-select" data-campo="id_cargo" ${ehEu ? 'disabled' : ''}>${UI.opcoes(cargos, v.id_cargo, { vazio: 'Selecione' })}</select>
          ${ehEu ? '<div class="form-text">Você não pode mudar o seu próprio cargo.</div>' : ''}</div>
        <div class="col-md-6"><label class="form-label">Unidade principal</label>
          <select class="form-select" data-campo="id_unidade">${UI.opcoes(S.unidades, v.id_unidade, { vazio: 'Nenhuma' })}</select></div>
        <div class="col-md-3"><label class="form-label">OAB nº</label><input class="form-control" data-campo="oab_numero" value="${UI.esc(v.oab_numero)}"></div>
        <div class="col-md-2"><label class="form-label">UF</label><select class="form-select" data-campo="oab_uf">${UI.opcoes(ufs, v.oab_uf, { vazio: '-' })}</select></div>
        <div class="col-md-4"><label class="form-label">CPF</label><input class="form-control" data-campo="cpf" data-mascara="cpf" value="${UI.esc(v.cpf)}"></div>
        <div class="col-md-3"><label class="form-label">RG</label><input class="form-control" data-campo="rg" value="${UI.esc(v.rg)}"></div>
        <div class="col-md-4"><label class="form-label">Nacionalidade</label><input class="form-control" data-campo="nacionalidade" value="${UI.esc(v.nacionalidade || 'brasileiro(a)')}"></div>
        <div class="col-md-4"><label class="form-label">Estado civil</label><select class="form-select" data-campo="estado_civil">${UI.opcoes(S.listas.estado_civil || [], v.estado_civil, { vazio: '-' })}</select></div>
        <div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" data-campo="telefone" data-mascara="telefone" value="${UI.esc(v.telefone)}"></div>
        ${UI.campo({ rotulo: 'Gênero (para os documentos)', campo: 'genero', valor: v.genero, tipo: 'select', col: 'col-md-4', opcoes: ['Feminino', 'Masculino'], vazio: '-' })}
        ${UI.campo({ rotulo: 'E-mail profissional (sai nos documentos)', campo: 'email_profissional', valor: v.email_profissional, tipo: 'email', col: 'col-md-8' })}
        <div class="col-12"><label class="form-label">Endereço profissional</label><input class="form-control" data-campo="endereco_profissional" value="${UI.esc(v.endereco_profissional)}">
          <div class="form-text">OAB, CPF, RG e endereço são usados na qualificação das procurações e contratos.</div></div>
        <div class="col-12"><label class="form-label">Áreas de atuação</label>
          <div class="d-flex flex-wrap gap-3">${S.areas.map(a => `<label class="form-check">
            <input class="form-check-input" type="checkbox" data-area value="${UI.esc(a.id)}" ${(v.areas || []).includes(a.id) ? 'checked' : ''}>
            <span class="form-check-label"><span class="ponto-cor" style="background:${UI.esc(a.cor)}"></span>${UI.esc(a.nome)}</span></label>`).join('')}</div>
          <div class="form-text">Para cargos com escopo "por área", o usuário só enxerga os casos destas áreas.</div></div>
      </form>`,
      rodape: `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" data-salvar>Salvar</button>`
    });

    Modulos.usuarios.ligarMascaras(m.el);

    m.el.querySelector('[data-salvar]').onclick = async ev => {
      const dados = UI.lerForm(m.el);
      if (ehEu) dados.id_cargo = v.id_cargo;
      dados.areas = [...m.el.querySelectorAll('[data-area]:checked')].map(i => i.value);
      if (u) dados.id_usuario = u.id_usuario;
      if (!dados.nome || !dados.email || !dados.id_cargo) return UI.toast('Preencha nome, e-mail e cargo.', 'aviso');
      await UI.ocupado(ev.target, async () => {
        try {
          const r = await Api.chamar('usuarios.salvar', dados);
          m.fechar();
          UI.toast(u ? 'Usuário atualizado.' : 'Usuário criado.');
          if (r.senha_temporaria) UI.mostrarSenha('Senha temporária', r.senha_temporaria, `Envie esta senha para ${dados.nome} por um canal seguro (pessoalmente ou WhatsApp).`);
          await App.recarregarDados();
          await this.carregar(App.S);
        } catch (e) { UI.erro(e); }
      });
    };
  },

  async redefinirSenha(u) {
    if (!await UI.confirmar(`Gerar uma nova senha temporária para ${u.nome}? A senha atual deixa de funcionar.`, { titulo: 'Redefinir senha', botao: 'Gerar nova senha' })) return;
    try {
      const r = await Api.chamar('usuarios.redefinirSenha', { id_usuario: u.id_usuario });
      UI.mostrarSenha('Nova senha temporária', r.senha_temporaria, `Envie esta senha para ${u.nome} por um canal seguro.`);
      await this.carregar(App.S);
    } catch (e) { UI.erro(e); }
  },

  async alternarAtivo(u, S) {
    const ativar = u.ativo === 'NAO';
    const ok = await UI.confirmar(ativar ? `Reativar o acesso de ${u.nome}?` : `Inativar ${u.nome}? Ele perde o acesso na hora, mas o histórico é mantido.`,
      { titulo: ativar ? 'Reativar usuário' : 'Inativar usuário', botao: ativar ? 'Reativar' : 'Inativar', perigo: !ativar });
    if (!ok) return;
    try {
      await Api.chamar('usuarios.alternarAtivo', { id_usuario: u.id_usuario });
      UI.toast(ativar ? 'Usuário reativado.' : 'Usuário inativado.');
      await App.recarregarDados();
      await this.carregar(App.S);
    } catch (e) { UI.erro(e); }
  },

  ligarMascaras(el) {
    el.querySelectorAll('[data-mascara="cpf"]').forEach(i => i.addEventListener('input', () => {
      let v = i.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      i.value = v;
    }));
    el.querySelectorAll('[data-mascara="telefone"]').forEach(i => i.addEventListener('input', () => {
      let v = i.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10) v = v.replace(/^(\d\d)(\d{5})(\d{4}).*/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/^(\d\d)(\d{0,5})/, '($1) $2');
      i.value = v;
    }));
  }
};

</script>
<script>
/* ======== js/modulos/cargos.js ======== */
/**
 * Cargos e permissões — escopo de dados + matriz módulo x ação.
 */
Modulos.cargos = {
  dados: [],
  ESCOPOS: {
    TODOS: 'Todos os registros do escritório',
    AREAS: 'Só das áreas de atuação do usuário',
    PROPRIOS: 'Só onde o usuário é responsável ou apoio'
  },
  ACOES: [['ver', 'Ver'], ['criar', 'Criar'], ['editar', 'Editar'], ['excluir', 'Excluir'], ['exportar', 'Exportar']],

  async render(el, S) {
    el.innerHTML = `
      <div class="cabecalho-pagina">
        <div><h1>Cargos e permissões</h1><p>Defina o que cada cargo vê e faz em cada módulo</p></div>
        ${App.pode('cargos', 'criar') ? '<button class="btn btn-primary" data-novo><i class="bi bi-plus-lg me-1"></i>Novo cargo</button>' : ''}
      </div>
      <div class="row g-3" id="cargos-lista"><div class="vazio"><div class="spinner-border"></div></div></div>`;
    const b = el.querySelector('[data-novo]');
    if (b) b.onclick = () => this.formulario(null, S);
    el.querySelector('#cargos-lista').addEventListener('click', e => {
      const btn = e.target.closest('[data-acao]');
      if (!btn) return;
      const c = this.dados.find(x => x.id_cargo === btn.dataset.id);
      if (btn.dataset.acao === 'editar') this.formulario(c, S);
      if (btn.dataset.acao === 'ativo') this.alternarAtivo(c);
    });
    await this.carregar();
  },

  async carregar() {
    try { this.dados = await Api.chamar('cargos.listar'); } catch (e) { return UI.erro(e); }
    const lista = document.getElementById('cargos-lista');
    if (!lista) return;
    lista.innerHTML = this.dados.map(c => {
      const mods = App.S.modulos.filter(m => c.permissoes[m.id] && c.permissoes[m.id].ver).map(m => m.nome);
      return `<div class="col-md-6 col-xl-4"><div class="cartao h-100 ${c.ativo === 'NAO' ? 'opacity-50' : ''}">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div><h2 class="h6 mb-0">${UI.esc(c.nome)}</h2><div class="small texto-2">${UI.esc(c.descricao || '')}</div></div>
          ${c.master === 'SIM' ? '<span class="chip chip-alerta">master</span>' : c.ativo === 'NAO' ? '<span class="chip chip-off">inativo</span>' : ''}
        </div>
        <div class="small mb-1"><i class="bi bi-eye me-1"></i>${UI.esc(this.ESCOPOS[c.escopo_dados] || '-')}</div>
        <div class="small mb-2"><i class="bi bi-people me-1"></i>${c.qtd_usuarios} usuário(s) ativo(s)</div>
        <div class="small texto-2 mb-3">${c.master === 'SIM' ? 'Acesso total a todos os módulos.' : (mods.length ? 'Acessa: ' + UI.esc(mods.join(', ')) : 'Sem acesso a módulos.')}</div>
        <div class="btn-group btn-group-sm">
          ${App.pode('cargos', 'editar') ? `<button class="btn btn-outline-secondary" data-acao="editar" data-id="${UI.esc(c.id_cargo)}"><i class="bi bi-pencil me-1"></i>Editar</button>` : ''}
          ${App.pode('cargos', 'excluir') && c.master !== 'SIM' ? `<button class="btn btn-outline-secondary" data-acao="ativo" data-id="${UI.esc(c.id_cargo)}">${c.ativo === 'NAO' ? 'Reativar' : 'Inativar'}</button>` : ''}
        </div>
      </div></div>`;
    }).join('');
  },

  formulario(c, S) {
    const v = c || { escopo_dados: 'PROPRIOS', permissoes: {} };
    const master = v.master === 'SIM';
    const grupos = [...new Set(S.modulos.map(m => m.grupo))];
    const matriz = master ? `<div class="alert alert-secondary small mb-0">O cargo master tem acesso total a todos os módulos e não pode ser restringido. Isso evita que o escritório fique sem ninguém capaz de administrar o sistema.</div>` : `
      <div class="table-responsive"><table class="table table-sm matriz-perm">
        <thead><tr><th>Módulo</th>${this.ACOES.map(a => `<th>${a[1]}</th>`).join('')}<th>Tudo</th></tr></thead>
        <tbody>${grupos.map(g => `<tr><td colspan="7" class="small texto-2 pt-3">${UI.esc(g)}</td></tr>` +
          S.modulos.filter(m => m.grupo === g).map(m => `<tr data-modulo="${m.id}">
            <td>${UI.esc(m.nome)}</td>
            ${this.ACOES.map(a => `<td><input class="form-check-input" type="checkbox" data-acao-perm="${a[0]}" ${v.permissoes[m.id] && v.permissoes[m.id][a[0]] ? 'checked' : ''} aria-label="${a[1]} ${UI.esc(m.nome)}"></td>`).join('')}
            <td><input class="form-check-input" type="checkbox" data-tudo aria-label="Tudo em ${UI.esc(m.nome)}"></td>
          </tr>`).join('')).join('')}
        </tbody></table></div>
      <div class="form-text">Marcar criar, editar, excluir ou exportar libera automaticamente o "ver". "Excluir" no sistema significa inativar — nada é apagado.</div>`;

    const m = UI.modal({
      titulo: c ? 'Editar cargo' : 'Novo cargo',
      tamanho: 'modal-lg',
      corpo: `<div class="row g-3 mb-3">
